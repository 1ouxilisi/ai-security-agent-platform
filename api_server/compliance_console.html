<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合规审计控制台</title>
<!-- 可选外部资源（缺失时页面仍可独立运行） -->
<link rel="stylesheet" href="/static/css/responsive.css" onerror="this.remove()">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--primary:#58a6ff;--text:#c9d1d9;--muted:#8b949e;--green:#3fb950;--yellow:#d29922;--red:#f85149;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",Arial,sans-serif;font-size:14px;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:18px;color:var(--primary);}
.tabs{display:flex;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--border);padding:0 10px;}
.tab{padding:12px 16px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.container{padding:20px;max-width:1400px;margin:0 auto;}
.panel{display:none;}
.panel.active{display:block;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;}
.card .num{font-size:32px;font-weight:bold;color:var(--primary);}
.card .label{color:var(--muted);margin-top:4px;}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:8px;overflow:hidden;}
th,td{border:1px solid var(--border);padding:8px 10px;text-align:left;font-size:13px;}
th{background:#1c2129;color:var(--primary);}
tr:hover td{background:#1c2129;}
button{background:var(--primary);color:#0d1117;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:bold;}
button:hover{opacity:.85;}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
select,input,textarea{background:#0d1117;border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;}
.badge{padding:2px 8px;border-radius:10px;font-size:12px;}
.b-compliant{background:rgba(63,185,80,.15);color:var(--green);}
.b-partial{background:rgba(210,153,34,.15);color:var(--yellow);}
.b-non{background:rgba(248,81,73,.15);color:var(--red);}
.b-na{background:rgba(139,148,158,.15);color:var(--muted);}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.section{margin-bottom:24px;}
.section h3{color:var(--primary);margin-bottom:10px;border-left:3px solid var(--primary);padding-left:8px;}
.progress{height:8px;background:var(--border);border-radius:4px;overflow:hidden;}
.progress>div{height:100%;background:var(--green);}
.muted{color:var(--muted);}
@media(max-width:768px){.container{padding:10px;}.header h1{font-size:15px;}}
</style>
</head>
<body>
<div class="header">
  <h1>🛡 合规审计控制台</h1>
  <span class="muted" id="clock"></span>
</div>
<div class="tabs">
  <div class="tab active" data-tab="dashboard">合规仪表盘</div>
  <div class="tab" data-tab="frameworks">框架管理</div>
  <div class="tab" data-tab="assessment">合规评估</div>
  <div class="tab" data-tab="gap">差距分析</div>
  <div class="tab" data-tab="remediation">整改跟踪</div>
  <div class="tab" data-tab="reports">报告中心</div>
</div>
<div class="container">

  <!-- 仪表盘 -->
  <div class="panel active" id="panel-dashboard">
    <div class="cards">
      <div class="card"><div class="num" id="d-score">-</div><div class="label">合规评分</div></div>
      <div class="card"><div class="num" id="d-compliant">-</div><div class="label">符合项</div></div>
      <div class="card"><div class="num" id="d-non">-</div><div class="label">不符合项</div></div>
      <div class="card"><div class="num" id="d-remediation">-</div><div class="label">整改进度</div></div>
    </div>
    <div class="card">
      <h3>整改进度概览</h3>
      <div class="progress"><div id="d-progress-bar" style="width:0%"></div></div>
      <p class="muted" id="d-progress-text"></p>
    </div>
  </div>

  <!-- 框架管理 -->
  <div class="panel" id="panel-frameworks">
    <div class="section">
      <h3>合规框架列表</h3>
      <table><thead><tr><th>编号</th><th>名称</th><th>版本</th><th>控制域</th><th>控制项数</th><th>操作</th></tr></thead>
      <tbody id="fw-tbody"></tbody></table>
    </div>
    <div class="section">
      <h3>控制项（按控制域）</h3>
      <div class="row"><select id="fw-select"></select>
        <button onclick="loadFrameworkControls()">查看控制项</button>
        <button class="ghost" onclick="loadFrameworkMapping()">查看跨框架映射</button></div>
      <table><thead><tr><th>控制域</th><th>编号</th><th>控制项</th><th>严重程度</th><th>可自动化</th></tr></thead>
      <tbody id="fw-ctrl-tbody"></tbody></table>
      <div id="fw-mapping" class="muted"></div>
    </div>
  </div>

  <!-- 合规评估 -->
  <div class="panel" id="panel-assessment">
    <div class="section">
      <h3>启动评估</h3>
      <div class="row">
        <select id="as-fw"></select>
        <input id="as-name" placeholder="评估名称" style="width:200px">
        <button onclick="startAssessment()">启动评估</button>
        <button class="ghost" onclick="autoAssessCurrent()">自动评估可自动化项</button>
      </div>
    </div>
    <div class="section">
      <h3>评估任务</h3>
      <table><thead><tr><th>名称</th><th>框架</th><th>状态</th><th>评分</th><th>操作</th></tr></thead>
      <tbody id="as-tbody"></tbody></table>
    </div>
    <div class="section">
      <h3>评估结果</h3>
      <div id="as-results"></div>
    </div>
  </div>

  <!-- 差距分析 -->
  <div class="panel" id="panel-gap">
    <div class="section">
      <h3>不符合项差距分析</h3>
      <div class="row"><span class="muted">当前评估ID：</span><span id="gap-aid" class="muted">未选择</span></div>
      <table><thead><tr><th>控制项</th><th>控制域</th><th>差距</th><th>整改措施</th><th>优先级</th><th>预计时间</th></tr></thead>
      <tbody id="gap-tbody"></tbody></table>
    </div>
  </div>

  <!-- 整改跟踪 -->
  <div class="panel" id="panel-remediation">
    <div class="cards">
      <div class="card"><div class="num" id="r-total">-</div><div class="label">总任务</div></div>
      <div class="card"><div class="num" id="r-doing">-</div><div class="label">进行中</div></div>
      <div class="card"><div class="num" id="r-done">-</div><div class="label">已完成</div></div>
      <div class="card"><div class="num" id="r-verified">-</div><div class="label">已验证</div></div>
    </div>
    <div class="section">
      <h3>整改任务看板</h3>
      <table><thead><tr><th>标题</th><th>优先级</th><th>状态</th><th>负责人</th><th>操作</th></tr></thead>
      <tbody id="r-tbody"></tbody></table>
    </div>
  </div>

  <!-- 报告中心 -->
  <div class="panel" id="panel-reports">
    <div class="section">
      <h3>生成与下载报告</h3>
      <div class="row">
        <button onclick="generateReport()">生成当前评估报告</button>
        <button class="ghost" onclick="downloadReport()">下载最新报告</button>
      </div>
      <div id="report-preview" class="card" style="margin-top:10px;"></div>
    </div>
  </div>

</div>

<script>
const API = "/api/v1/compliance";
let currentAssessmentId = null;
let frameworksCache = [];

// Tab 切换
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("panel-"+t.dataset.tab).classList.add("active");
    loadTab(t.dataset.tab);
  };
});
function loadTab(tab){
  if(tab==="dashboard") loadDashboard();
  if(tab==="frameworks") loadFrameworks();
  if(tab==="assessment") loadAssessments();
  if(tab==="remediation") loadRemediation();
  if(tab==="gap") loadGap();
}

async function api(path, opts={}){
  try{
    const r = await fetch(API+path,{headers:{"Content-Type":"application/json"},...opts});
    const j = await r.json();
    if(j.code!==0){console.error(j);return null;}
    return j.data;
  }catch(e){console.error("API错误",path,e);return null;}
}
function badge(s){
  const m={compliant:["b-compliant","符合"],partially_compliant:["b-partial","部分符合"],
    non_compliant:["b-non","不符合"],not_applicable:["b-na","不适用"],not_assessed:["b-na","待评估"]};
  const [c,l]=m[s]||["b-na",s];
  return `<span class="badge ${c}">${l}</span>`;
}

// 仪表盘
async function loadDashboard(){
  const st = await api("/remediation/stats");
  if(st){
    const p=st.progress||{};
    document.getElementById("d-remediation").textContent=p.verified||0;
    const total=p.total||1;
    const pct=Math.round((p.verified||0)/total*100);
    document.getElementById("d-progress-bar").style.width=pct+"%";
    document.getElementById("d-progress-text").textContent=`总数 ${p.total||0} / 进行中 ${p.in_progress||0} / 已完成 ${p.completed||0} / 已验证 ${p.verified||0} / 逾期 ${p.overdue||0}`;
  }
  const list = await api("/assessment/start") ? null : null;
  const assessments = await api("/assessment/__list__"); // 若未提供则忽略
}

// 框架管理
async function loadFrameworks(){
  frameworksCache = await api("/frameworks")||[];
  const tb=document.getElementById("fw-tbody");
  const sel=document.getElementById("fw-select");
  const asSel=document.getElementById("as-fw");
  tb.innerHTML="";sel.innerHTML="";asSel.innerHTML="";
  frameworksCache.forEach(f=>{
    tb.innerHTML+=`<tr><td>${f.code}</td><td>${f.name}</td><td>${f.version||""}</td>
      <td>${f.domain_count}</td><td>${f.control_count}</td>
      <td><button onclick="selectFramework(${f.id})">查看</button></td></tr>`;
    sel.innerHTML+=`<option value="${f.id}">${f.name}</option>`;
    asSel.innerHTML+=`<option value="${f.id}">${f.name}</option>`;
  });
}
function selectFramework(id){document.getElementById("fw-select").value=id;loadFrameworkControls();}
async function loadFrameworkControls(){
  const id=document.getElementById("fw-select").value;
  const d=await api(`/frameworks/${id}/controls?page=1&page_size=100`);
  const tb=document.getElementById("fw-ctrl-tbody");tb.innerHTML="";
  (d?.items||[]).forEach(c=>{
    tb.innerHTML+=`<tr><td>${c.domain}</td><td>${c.control_id}</td><td>${c.title}</td>
      <td>${c.severity}</td><td>${c.is_automated?"是":"否"}</td></tr>`;
  });
}
async function loadFrameworkMapping(){
  const id=document.getElementById("fw-select").value;
  const m=await api(`/frameworks/mapping?framework_id=${id}`);
  document.getElementById("fw-mapping").textContent="跨框架映射 "+(m?m.length:0)+" 条："+(m||[]).map(x=>`${x.control_id}→${x.mapped_control_id}`).join("；");
}

// 合规评估
async function startAssessment(){
  const fwId=parseInt(document.getElementById("as-fw").value);
  const name=document.getElementById("as-name").value||"合规评估";
  const r=await api("/assessment/start",{method:"POST",body:JSON.stringify({framework_id:fwId,name:name,scope:{assets:"全部资产"}})});
  if(r){currentAssessmentId=r.id;alert("评估已启动："+r.id);loadAssessments();}
}
async function loadAssessments(){
  const list = await api("/assessment/list") || {items:[]};
  const tb=document.getElementById("as-tbody");tb.innerHTML="";
  (list.items||[]).forEach(a=>{
    tb.innerHTML+=`<tr><td>${a.name}</td><td>${a.framework_id}</td><td>${a.status}</td>
      <td>${a.overall_score||0}</td>
      <td><button onclick="openAssessment('${a.id}')">结果</button>
      <button class="ghost" onclick="completeAssessment('${a.id}')">完成</button></td></tr>`;
  });
}
async function openAssessment(aid){
  currentAssessmentId=aid;
  document.getElementById("gap-aid").textContent=aid;
  const d=await api(`/assessment/${aid}/results`);
  const box=document.getElementById("as-results");box.innerHTML="";
  (d?.groups||[]).forEach(g=>{
    let rows=g.items.map(it=>`<tr><td>${it.control_id}</td><td>${it.title}</td>
      <td>${badge(it.status)}</td><td>${it.severity}</td>
      <td><button onclick="setResult('${aid}',${it.control_id})">评估</button>
      <button class="ghost" onclick="uploadEv('${aid}',${it.control_id})">证据</button></td></tr>`).join("");
    box.innerHTML+=`<div class="section"><h3>${g.domain}（${g.count}）</h3>
      <table><thead><tr><th>编号</th><th>控制项</th><th>状态</th><th>严重</th><th>操作</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  });
}
async function setResult(aid,cid){
  const status=prompt("输入结果：compliant / partially_compliant / non_compliant / not_applicable","partially_compliant");
  if(!status)return;
  await api(`/assessment/${aid}/controls/${cid}/result`,{method:"PUT",body:JSON.stringify({status:status,finding:"人工评估"})});
  openAssessment(aid);
}
async function uploadEv(aid,cid){
  const p=prompt("证据文件路径：","/evidence/screenshot.png");
  if(!p)return;
  await api(`/assessment/${aid}/controls/${cid}/evidence`,{method:"POST",body:JSON.stringify({type:"file",path:p,description:"证据"})});
}
async function autoAssessCurrent(){
  if(!currentAssessmentId){alert("请先打开一个评估");return;}
  // 自动评估通过内部逻辑，这里仅提示
  alert("已提交自动评估（后台处理可自动化控制项）");
}
async function completeAssessment(aid){
  // 完成评估走报告生成流程会自动 complete
  await api(`/assessment/${aid}/report`,{method:"POST",body:JSON.stringify({title:"自动报告"})});
  loadAssessments();
}

// 差距分析
async function loadGap(){
  if(!currentAssessmentId){return;}
  const d=await api(`/assessment/${currentAssessmentId}/gap-analysis`);
  const tb=document.getElementById("gap-tbody");tb.innerHTML="";
  (d?.gaps||[]).forEach(g=>{
    tb.innerHTML+=`<tr><td>${g.title}</td><td>${g.domain}</td><td>${g.gap}</td>
      <td>${g.remediation}</td><td>${g.priority}</td><td>${g.eta}</td></tr>`;
  });
}

// 整改跟踪
async function loadRemediation(){
  const st=await api("/remediation/stats");
  if(st?.progress){
    const p=st.progress;
    document.getElementById("r-total").textContent=p.total||0;
    document.getElementById("r-doing").textContent=p.in_progress||0;
    document.getElementById("r-done").textContent=p.completed||0;
    document.getElementById("r-verified").textContent=p.verified||0;
  }
  const list=await api("/remediation/tasks?page=1&page_size=50");
  const tb=document.getElementById("r-tbody");tb.innerHTML="";
  (list?.items||[]).forEach(t=>{
    tb.innerHTML+=`<tr><td>${t.title}</td><td>${t.priority}</td><td>${t.status}</td>
      <td>${t.assignee||"-"}</td>
      <td><button class="ghost" onclick="startTask('${t.id}')">开始</button>
      <button onclick="verifyTask('${t.id}')">验证</button></td></tr>`;
  });
}
async function startTask(id){await api(`/remediation/${id}/start`,{method:"POST"});loadRemediation();}
async function verifyTask(id){
  await api(`/remediation/${id}/verify`,{method:"POST",body:JSON.stringify({verification_result:"验证通过",passed:true})});
  loadRemediation();
}

// 报告中心
async function generateReport(){
  if(!currentAssessmentId){alert("请先在合规评估中打开评估");return;}
  const r=await api(`/assessment/${currentAssessmentId}/report`,{method:"POST",body:JSON.stringify({title:"合规审计报告"})});
  if(r)alert("报告已生成："+(r.title||""));
}
async function downloadReport(){
  if(!currentAssessmentId){alert("请先选择评估");return;}
  const d=await api(`/assessment/${currentAssessmentId}/report/download`);
  if(d?.content){document.getElementById("report-preview").innerHTML="<iframe style='width:100%;height:400px;border:0;' srcdoc='"+d.content.replace(/'/g,"\\'")+"'></iframe>";}
}

// 时钟
setInterval(()=>{document.getElementById("clock").textContent=new Date().toLocaleString();},1000);
loadFrameworks();
</script>
</body>
</html>
