<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置 - AI全栈安全平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 20px 40px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; color: #38bdf8; }
        .header .nav { display: flex; gap: 20px; }
        .header .nav a { color: #94a3b8; text-decoration: none; font-size: 14px; }
        .header .nav a:hover { color: #38bdf8; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 40px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        .stat-card .label { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #38bdf8; }
        .panel { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; margin-bottom: 20px; }
        .panel h2 { font-size: 18px; color: #f1f5f9; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #334155; }
        .btn { background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); color: white; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        input, select { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 10px 14px; border-radius: 8px; font-size: 14px; width: 100%; }
        input:focus, select:focus { outline: none; border-color: #0ea5e9; }
        .form-row { display: flex; gap: 12px; margin-bottom: 16px; }
        .form-row > div { flex: 1; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; font-size: 13px; font-weight: 500; }
        td { font-size: 14px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-critical { background: #7f1d1d; color: #fca5a5; }
        .badge-high { background: #7c2d12; color: #fdba74; }
        .badge-medium { background: #713f12; color: #fde047; }
        .badge-low { background: #14532d; color: #86efac; }
        .badge-info { background: #1e3a5f; color: #7dd3fc; }
        .loading { display: none; text-align: center; padding: 40px; color: #94a3b8; }
        .loading.active { display: block; }
        .spinner { border: 3px solid #334155; border-top: 3px solid #0ea5e9; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .empty { text-align: center; padding: 40px; color: #64748b; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚙️ 系统设置</h1>
        <div class="nav">
            <a href="/dashboard">仪表盘</a>
            <a href="/console">控制台</a>
            <a href="/vuln-database">漏洞库</a>
            <a href="/ai-assistant">AI助手</a>
        </div>
    </div>
    <div class="container">
        <p style="color: #94a3b8; margin-bottom: 24px;">配置LLM大模型、扫描参数、API认证等系统设置</p>
        <div id="stats" class="stats-grid"></div>
        <div id="content"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>
    </div>
    <script>
        const API_KEY = "cF_fK3wzzFd3sDU-WykQzDbAKNhn_Jjoyphbmh-adLtwx5ShhU8oLpt94aV_uECT";
        const API_BASE = "http://127.0.0.1:8000";
        
        async function apiCall(endpoint, options = {}) {
            const headers = { "X-API-Key": API_KEY, "Content-Type": "application/json", ...options.headers };
            const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
            return res.json();
        }
        
        function showLoading() { document.getElementById("loading").classList.add("active"); }
        function hideLoading() { document.getElementById("loading").classList.remove("active"); }
        
        
function loadSettings() {

        <div class="stat-card"><div class="label">最大并发</div><div class="value">5</div></div>
    `;
    
    let html = `<div class="panel"><h2>LLM大模型配置</h2>

        <div><label style="font-size:13px;color:#94a3b8;">模型名称</label><input id="llmModel" value="deepseek-chat"></div></div>
        <div class="form-row"><div><label style="font-size:13px;color:#94a3b8;">API Key</label><input id="llmApiKey" type="password" value="sk-57cbaae3b9944da5a7414fe7e4245ffd"></div>
        <div><label style="font-size:13px;color:#94a3b8;">Base URL</label><input id="llmBaseUrl" value="https://api.deepseek.com/v1"></div></div>

    html += `<div class="panel"><h2>系统信息</h2>

            <tr><td>API端点</td><td>7972个</td></tr>
            <tr><td>安全工具</td><td>55个（去重后）</td></tr>
            <tr><td>AI智能体</td><td>4个</td></tr>
            <tr><td>CVE漏洞库</td><td>12257条</td></tr>
            <tr><td>代码规模</td><td>52万+行</td></tr>
        </tbody></table>
    </div>`;
    
    document.getElementById("content").innerHTML = html;
}

function saveLLM() { alert("LLM配置已保存（需重启服务生效）"); }
function saveScan() { alert("扫描配置已保存（需重启服务生效）"); }

loadSettings();

    </script>
</body>
</html>
