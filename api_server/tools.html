<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具管理 - AI全栈安全平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 20px 40px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; color: #38bdf8; }
        .header .nav { display: flex; gap: 20px; }
        .header .nav a { color: #94a3b8; text-decoration: none; font-size: 14px; }
        .header .nav a:hover { color: #38bdf8; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 40px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        .stat-card .label { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #38bdf8; }
        .panel { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; margin-bottom: 20px; }
        .panel h2 { font-size: 18px; color: #f1f5f9; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #334155; }
        .btn { background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); color: white; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        input, select { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 10px 14px; border-radius: 8px; font-size: 14px; width: 100%; }
        input:focus, select:focus { outline: none; border-color: #0ea5e9; }
        .form-row { display: flex; gap: 12px; margin-bottom: 16px; }
        .form-row > div { flex: 1; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; font-size: 13px; font-weight: 500; }
        td { font-size: 14px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-critical { background: #7f1d1d; color: #fca5a5; }
        .badge-high { background: #7c2d12; color: #fdba74; }
        .badge-medium { background: #713f12; color: #fde047; }
        .badge-low { background: #14532d; color: #86efac; }
        .badge-info { background: #1e3a5f; color: #7dd3fc; }
        .loading { display: none; text-align: center; padding: 40px; color: #94a3b8; }
        .loading.active { display: block; }
        .spinner { border: 3px solid #334155; border-top: 3px solid #0ea5e9; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .empty { text-align: center; padding: 40px; color: #64748b; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔧 工具管理</h1>
        <div class="nav">
            <a href="/dashboard">仪表盘</a>
            <a href="/console">控制台</a>
            <a href="/vuln-database">漏洞库</a>
            <a href="/ai-assistant">AI助手</a>
        </div>
    </div>
    <div class="container">
        <p style="color: #94a3b8; margin-bottom: 24px;">管理和调用所有安全工具，支持端口扫描、Web漏洞测试、内网渗透等55+工具</p>
        <div id="stats" class="stats-grid"></div>
        <div id="content"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>
    </div>
    <script>
        const API_KEY = "cF_fK3wzzFd3sDU-WykQzDbAKNhn_Jjoyphbmh-adLtwx5ShhU8oLpt94aV_uECT";
        const API_BASE = "http://127.0.0.1:8000";
        
        async function apiCall(endpoint, options = {}) {
            const headers = { "X-API-Key": API_KEY, "Content-Type": "application/json", ...options.headers };
            const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
            return res.json();
        }
        
        function showLoading() { document.getElementById("loading").classList.add("active"); }
        function hideLoading() { document.getElementById("loading").classList.remove("active"); }
        
        
async function loadTools() {
    showLoading();
    try {
        const data = await apiCall("/api/v1/tools");
        document.getElementById("stats").innerHTML = `
            <div class="stat-card"><div class="label">工具总数</div><div class="value">${data.total}</div></div>
            <div class="stat-card"><div class="label">侦察类</div><div class="value">${data.tools.filter(t => t.name.includes('scan') || t.name.includes('dns') || t.name.includes('subdomain')).length}</div></div>
            <div class="stat-card"><div class="label">Web安全</div><div class="value">${data.tools.filter(t => t.name.includes('sql') || t.name.includes('xss') || t.name.includes('ssrf') || t.name.includes('dir')).length}</div></div>
            <div class="stat-card"><div class="label">内网渗透</div><div class="value">${data.tools.filter(t => t.name.includes('internal') || t.name.includes('smb') || t.name.includes('ldap') || t.name.includes('kerberos')).length}</div></div>
        `;
        
        let tableHtml = `<div class="panel"><h2>工具列表</h2><table><thead><tr><th>工具名</th><th>描述</th><th>分类</th><th>操作</th></tr></thead><tbody>`;
        data.tools.forEach(t => {
            tableHtml += `<tr><td><code style="color:#38bdf8;">${t.name}</code></td><td>${t.description.substring(0, 60)}...</td><td><span class="badge badge-info">${t.category || 'general'}</span></td><td><button class="btn" onclick="callTool('${t.name}')">调用</button></td></tr>`;
        });
        tableHtml += `</tbody></table></div>`;
        document.getElementById("content").innerHTML = tableHtml;
    } catch(e) {
        document.getElementById("content").innerHTML = `<div class="empty">加载失败: ${e.message}</div>`;
    }
    hideLoading();
}

async function callTool(name) {
    const target = prompt("请输入目标（如 127.0.0.1）:", "127.0.0.1");
    if (!target) return;
    showLoading();
    try {
        const result = await apiCall("/api/v1/tools/call", {
            method: "POST",
            body: JSON.stringify({ tool_name: name, parameters: { target: target } })
        });
        alert(`工具调用结果:\n状态: ${result.status}\n耗时: ${result.duration_ms}ms\n结果: ${JSON.stringify(result.result).substring(0, 500)}`);
    } catch(e) {
        alert(`调用失败: ${e.message}`);
    }
    hideLoading();
}

loadTools();

    </script>
</body>
</html>
