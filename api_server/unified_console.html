<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page.unified.title">全域安全评估平台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0f1e;
  --bg2: #1a1a2e;
  --bg3: #16213e;
  --card: #1e2a4a;
  --border: #2d3a5e;
  --text: #e0e6f0;
  --muted: #8892b0;
  --accent: #00d4ff;
  --critical: #dc2626;
  --high: #ea580c;
  --medium: #ca8a04;
  --low: #2563eb;
  --info: #6b7280;
}
body {
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
}
code, pre, .mono { font-family: "Consolas", "Courier New", monospace; }

/* ===== 顶部导航 ===== */
.navbar {
  background: linear-gradient(90deg, #1a1a2e 0%, #16213e 100%);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
}
.navbar .brand {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  margin-right: 32px;
  white-space: nowrap;
}
.navbar .brand span { color: #fff; }
.nav-tabs { display: flex; gap: 4px; flex: 1; }
.nav-tab {
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
  transition: all .2s;
  border: 1px solid transparent;
  background: transparent;
}
.nav-tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.nav-tab.active {
  color: #fff;
  background: rgba(0,212,255,0.15);
  border-color: var(--accent);
}
.nav-tab.comprehensive {
  background: linear-gradient(135deg, #dc2626, #ea580c);
  color: #fff;
  border: none;
  font-weight: 600;
}
.nav-tab.comprehensive:hover { filter: brightness(1.1); }

/* ===== 主布局 ===== */
.layout {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 16px;
  padding: 16px 24px;
  max-width: 1600px;
  margin: 0 auto;
}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
}
.panel, .main-area {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
}
.panel h3, .main-area h3 {
  font-size: 15px;
  color: var(--accent);
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}
.form-group input[type=text],
.form-group input[type=number],
.form-group select,
.form-group textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 8px 10px;
  font-size: 13px;
  font-family: inherit;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.btn {
  padding: 10px 18px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all .2s;
}
.btn-primary {
  background: linear-gradient(135deg, #00d4ff, #0077ff);
  color: #fff;
  width: 100%;
}
.btn-primary:hover { filter: brightness(1.1); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--bg3); }
.btn-danger { background: var(--critical); color: #fff; }

/* ===== 进度 ===== */
.progress-box {
  display: none;
  padding: 12px;
  background: var(--bg);
  border-radius: 6px;
  margin-bottom: 14px;
  border-left: 3px solid var(--accent);
}
.progress-box.active { display: block; }
.progress-box .p-title { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
.progress-box .p-detail { font-size: 12px; color: var(--muted); }
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid var(--accent);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin .8s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 风险概览卡片 ===== */
.risk-overview { display: none; }
.risk-overview.active { display: block; }
.risk-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.risk-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  text-align: center;
}
.risk-card .num { font-size: 28px; font-weight: 700; }
.risk-card .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* 圆环 */
.risk-ring-wrap {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.risk-ring {
  width: 120px; height: 120px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.risk-ring::before {
  content: "";
  position: absolute;
  inset: 10px;
  background: var(--bg2);
  border-radius: 50%;
}
.risk-ring .ring-text {
  position: relative;
  z-index: 1;
  text-align: center;
}
.risk-ring .ring-num { font-size: 26px; font-weight: 700; }
.risk-ring .ring-lbl { font-size: 11px; color: var(--muted); }

/* 领域风险条 */
.domain-bars { flex: 1; min-width: 250px; }
.domain-bar { margin-bottom: 8px; }
.domain-bar .db-head {
  display: flex; justify-content: space-between;
  font-size: 12px; margin-bottom: 4px;
}
.domain-bar .db-track {
  height: 14px;
  background: var(--bg);
  border-radius: 4px;
  overflow: hidden;
}
.domain-bar .db-fill {
  height: 100%;
  border-radius: 4px;
  transition: width .6s;
}

/* ===== 漏洞列表 ===== */
.filters {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.filters select, .filters input {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 13px;
}
.filters label { font-size: 12px; color: var(--muted); }

.finding-list { display: flex; flex-direction: column; gap: 8px; }
.finding-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-left: 4px solid var(--info);
  border-radius: 6px;
  overflow: hidden;
}
.finding-item.sev-critical { border-left-color: var(--critical); }
.finding-item.sev-high { border-left-color: var(--high); }
.finding-item.sev-medium { border-left-color: var(--medium); }
.finding-item.sev-low { border-left-color: var(--low); }
.finding-item.sev-info { border-left-color: var(--info); }

.finding-head {
  padding: 10px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}
.finding-head:hover { background: rgba(255,255,255,0.03); }
.sev-tag {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
}
.sev-tag.critical { background: var(--critical); }
.sev-tag.high { background: var(--high); }
.sev-tag.medium { background: var(--medium); }
.sev-tag.low { background: var(--low); }
.sev-tag.info { background: var(--info); }
.finding-title { flex: 1; font-size: 13px; }
.finding-domain { font-size: 11px; color: var(--muted); }
.finding-body {
  display: none;
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  font-size: 13px;
}
.finding-item.open .finding-body { display: block; }
.finding-body .row { margin-bottom: 8px; }
.finding-body .row-label { color: var(--muted); font-size: 12px; }
.finding-body pre {
  background: #0a0a14;
  padding: 10px;
  border-radius: 4px;
  overflow-x: auto;
  font-size: 12px;
  color: #a5f3fc;
  margin-top: 4px;
  white-space: pre-wrap;
  word-break: break-all;
}
.empty {
  text-align: center;
  color: var(--muted);
  padding: 30px;
  font-size: 13px;
}

/* ===== 报告按钮 ===== */
.report-actions {
  display: flex;
  gap: 10px;
  margin-top: 14px;
  flex-wrap: wrap;
}

/* ===== 知识库 ===== */
.kb-section {
  grid-column: 1 / -1;
}
.kb-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 900px) { .kb-grid { grid-template-columns: 1fr; } }
.kb-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 14px;
  margin-bottom: 8px;
}
.kb-item .kb-name { font-weight: 600; font-size: 13px; }
.kb-item .kb-desc { font-size: 12px; color: var(--muted); margin-top: 4px; }
.kb-item .kb-fix { font-size: 12px; color: #86efac; margin-top: 4px; }

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--card);
  border: 1px solid var(--accent);
  color: var(--text);
  padding: 12px 20px;
  border-radius: 8px;
  z-index: 1000;
  display: none;
  max-width: 350px;
}
.toast.show { display: block; }
.toast.error { border-color: var(--critical); }

.stat-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.stat-pill {
  background: var(--bg);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  border: 1px solid var(--border);
}
</style>
<link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>

<nav class="navbar">
  <div class="brand">🛡 全域安全<span>评估平台</span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" data-type="comprehensive" onclick="switchType('comprehensive', this)">综合评估</button>
    <button class="nav-tab" data-type="pentest" onclick="switchType('pentest', this)">渗透测试</button>
    <button class="nav-tab" data-type="mobile" onclick="switchType('mobile', this)">移动安全</button>
    <button class="nav-tab" data-type="blockchain" onclick="switchType('blockchain', this)">区块链安全</button>
    <button class="nav-tab" data-type="ai_agent" onclick="switchType('ai_agent', this)">AI智能体</button>
    <button class="nav-tab" onclick="loadKnowledgeTab()">知识库</button>
  </div>
</nav>

<div class="layout">

  <!-- 左侧面板 -->
  <aside class="panel">
    <h3>评估配置</h3>
    <div class="form-group">
      <label>评估类型</label>
      <select id="assessmentType" onchange="onTypeChange()">
        <option value="comprehensive">综合评估（全部领域）</option>
        <option value="pentest">渗透测试</option>
        <option value="mobile">移动安全</option>
        <option value="blockchain">区块链安全</option>
        <option value="ai_agent">AI智能体安全</option>
      </select>
    </div>
    <div class="form-group">
      <label>评估目标</label>
      <input type="text" id="target" placeholder="例如 192.168.1.100">
    </div>
    <div class="form-group">
      <label>选项配置（JSON，可选）</label>
      <textarea id="options" rows="3" placeholder='{"timeout": 60}'></textarea>
    </div>
    <button class="btn btn-primary" id="startBtn" onclick="startAssessment()">开始评估</button>

    <div class="progress-box" id="progressBox">
      <div class="p-title"><span class="spinner"></span>评估执行中...</div>
      <div class="p-detail" id="progressDetail">正在初始化引擎</div>
    </div>

    <div style="margin-top:18px;">
      <h3 style="margin-top:10px;">系统状态</h3>
      <div id="systemStats" class="stat-row">
        <span class="stat-pill">评估数: -</span>
        <span class="stat-pill">漏洞总数: -</span>
      </div>
      <button class="btn btn-secondary" style="width:100%;" onclick="loadStats()">刷新统计</button>
    </div>
  </aside>

  <!-- 右侧主区域 -->
  <main class="main-area">
    <div id="resultEmpty" class="empty">
      <h2 style="color:var(--muted);margin-bottom:10px;">尚未执行评估</h2>
      <p>在左侧输入目标并选择评估类型，点击"开始评估"按钮。</p>
      <p style="margin-top:10px;font-size:12px;">支持：渗透测试 / 移动安全 / 区块链安全 / AI智能体 / 综合评估</p>
    </div>

    <div class="risk-overview" id="riskOverview">
      <h3>风险概览</h3>
      <div class="risk-cards" id="statCards"></div>
      <div class="risk-ring-wrap">
        <div class="risk-ring" id="riskRing">
          <div class="ring-text">
            <div class="ring-num" id="ringNum">0</div>
            <div class="ring-lbl" id="ringLbl">综合风险</div>
          </div>
        </div>
        <div class="domain-bars" id="domainBars"></div>
      </div>
      <div id="execSummary" style="font-size:13px;color:var(--muted);margin-bottom:10px;"></div>
    </div>

    <div id="findingsSection" style="display:none;">
      <h3 style="margin-top:16px;">漏洞发现列表</h3>
      <div class="filters">
        <label>领域:</label>
        <select id="filterDomain" onchange="renderFindings()">
          <option value="">全部</option>
        </select>
        <label>严重程度:</label>
        <select id="filterSeverity" onchange="renderFindings()">
          <option value="">全部</option>
          <option value="critical">严重</option>
          <option value="high">高危</option>
          <option value="medium">中危</option>
          <option value="low">低危</option>
          <option value="info">信息</option>
        </select>
        <span id="findingCount" style="font-size:12px;color:var(--muted);"></span>
      </div>
      <div class="finding-list" id="findingList"></div>
      <div class="report-actions">
        <button class="btn btn-secondary" onclick="generateReport('html')">生成 HTML 报告</button>
        <button class="btn btn-secondary" onclick="generateReport('markdown')">生成 Markdown 报告</button>
        <button class="btn btn-secondary" onclick="generateReport('json')">生成 JSON 报告</button>
      </div>
    </div>

    <!-- 知识库区域 -->
    <div class="kb-section" id="kbSection" style="display:none;">
      <h3 style="margin-top:20px;">漏洞知识库</h3>
      <div class="filters">
        <label>领域:</label>
        <select id="kbDomain" onchange="loadKbTop()">
          <option value="pentest">渗透测试</option>
          <option value="mobile">移动安全</option>
          <option value="blockchain">区块链安全</option>
          <option value="ai_agent">AI智能体安全</option>
        </select>
        <label>搜索:</label>
        <input type="text" id="kbKeyword" placeholder="输入关键词，如 注入/重入" style="width:200px;">
        <button class="btn btn-secondary" onclick="searchKb()">搜索</button>
      </div>
      <div class="kb-grid">
        <div id="kbTopList"></div>
        <div id="kbSearchResult"></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/v1/unified';
let currentResult = null;
let currentAssessmentId = null;

const SEV_COLORS = {critical:'#dc2626', high:'#ea580c', medium:'#ca8a04', low:'#2563eb', info:'#6b7280'};
const SEV_LABELS = {critical:'严重', high:'高危', medium:'中危', low:'低危', info:'信息'};
const DOMAIN_LABELS = {pentest:'渗透测试', mobile:'移动安全', blockchain:'区块链安全', ai_agent:'AI智能体安全', comprehensive:'综合评估'};
const PLACEHOLDERS = {
  pentest: '目标 IP 或域名，例如 192.168.1.100 或 example.com',
  mobile: 'APK 文件路径，例如 /data/apps/target.apk',
  blockchain: '合约地址，例如 0x1234...abcd',
  ai_agent: 'AI 端点或 Prompt 文本，例如 https://api.example.com/chat',
  comprehensive: '评估目标（IP/域名/文件路径），将对所有领域进行评估',
};

function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3500);
}

function switchType(type, btn) {
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('assessmentType').value = type;
  onTypeChange();
}

function onTypeChange() {
  const t = document.getElementById('assessmentType').value;
  document.getElementById('target').placeholder = PLACEHOLDERS[t] || PLACEHOLDERS.comprehensive;
}

async function api(path, opts) {
  const resp = await fetch(API + path, opts);
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.detail || ('HTTP ' + resp.status));
  return data;
}

async function startAssessment() {
  const target = document.getElementById('target').value.trim();
  if (!target) { toast('请输入评估目标', true); return; }
  const type = document.getElementById('assessmentType').value;
  let options = {};
  const optText = document.getElementById('options').value.trim();
  if (optText) {
    try { options = JSON.parse(optText); } catch(e) { toast('选项 JSON 格式错误', true); return; }
  }
  const btn = document.getElementById('startBtn');
  btn.disabled = true; btn.textContent = '评估中...';
  const pb = document.getElementById('progressBox');
  pb.classList.add('active');
  document.getElementById('progressDetail').textContent = '正在调度评估引擎...';
  try {
    const data = await api('/assessment', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({target, assessment_type: type, options}),
    });
    currentResult = data.result;
    currentAssessmentId = data.assessment_id;
    document.getElementById('progressDetail').textContent = '评估完成，渲染结果';
    renderResult();
    toast('评估完成: ' + data.assessment_id);
  } catch(e) {
    toast('评估失败: ' + e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = '开始评估';
    setTimeout(() => pb.classList.remove('active'), 800);
  }
}

function renderResult() {
  if (!currentResult) return;
  document.getElementById('resultEmpty').style.display = 'none';
  document.getElementById('riskOverview').classList.add('active');
  document.getElementById('findingsSection').style.display = 'block';

  const r = currentResult;
  // 统计卡片
  const fc = r.findings_by_severity || {};
  const cards = [
    {n: r.overall_risk_score, l: '综合风险分', c: riskColor(r.overall_risk_level)},
    {n: fc.critical||0, l: '严重', c: SEV_COLORS.critical},
    {n: fc.high||0, l: '高危', c: SEV_COLORS.high},
    {n: fc.medium||0, l: '中危', c: SEV_COLORS.medium},
    {n: fc.low||0, l: '低危', c: SEV_COLORS.low},
    {n: fc.info||0, l: '信息', c: SEV_COLORS.info},
  ];
  document.getElementById('statCards').innerHTML = cards.map(c =>
    `<div class="risk-card"><div class="num" style="color:${c.c}">${c.n}</div><div class="lbl">${c.l}</div></div>`
  ).join('');

  // 圆环
  const score = r.overall_risk_score || 0;
  const color = riskColor(r.overall_risk_level);
  document.getElementById('riskRing').style.background =
    `conic-gradient(${color} ${score*3.6}deg, #1e293b 0deg)`;
  document.getElementById('ringNum').textContent = score;
  document.getElementById('ringNum').style.color = color;
  document.getElementById('ringLbl').textContent = r.overall_risk_level;

  // 领域条
  const dr = r.domain_results || {};
  const barsEl = document.getElementById('domainBars');
  barsEl.innerHTML = Object.values(dr).map(d => {
    const lvl = d.risk_level || '未评估';
    const c = riskColor(lvl);
    return `<div class="domain-bar">
      <div class="db-head"><span>${d.domain_label || d.domain}</span><span>${d.risk_score}分 · ${lvl} · ${d.findings_count}项</span></div>
      <div class="db-track"><div class="db-fill" style="width:${d.risk_score}%;background:${c}"></div></div>
    </div>`;
  }).join('') || '<div class="empty">无领域数据</div>';

  // 摘要
  document.getElementById('execSummary').textContent = r.executive_summary || '';

  // 领域筛选
  const fd = document.getElementById('filterDomain');
  const current = fd.value;
  fd.innerHTML = '<option value="">全部</option>' + Object.values(dr).map(d =>
    `<option value="${d.domain}">${d.domain_label || d.domain}</option>`).join('');
  fd.value = current;

  renderFindings();
}

function riskColor(level) {
  const map = {'严重':'#dc2626','高危':'#ea580c','中危':'#ca8a04','低危':'#2563eb','轻微':'#0891b2','安全':'#16a34a','未评估':'#6b7280'};
  return map[level] || '#6b7280';
}

function renderFindings() {
  if (!currentResult) return;
  const fd = document.getElementById('filterDomain').value;
  const fs = document.getElementById('filterSeverity').value;
  let list = currentResult.all_findings || [];
  if (fd) list = list.filter(f => f.domain === fd);
  if (fs) list = list.filter(f => f.severity === fs);
  document.getElementById('findingCount').textContent = `共 ${list.length} 项`;

  const el = document.getElementById('findingList');
  if (!list.length) { el.innerHTML = '<div class="empty">无匹配的漏洞发现</div>'; return; }

  el.innerHTML = list.map((f, i) => {
    const c = SEV_COLORS[f.severity] || SEV_COLORS.info;
    const lbl = SEV_LABELS[f.severity] || f.severity;
    const domLbl = DOMAIN_LABELS[f.domain] || f.domain;
    let meta = '';
    if (f.cwe) meta += `CWE: ${f.cwe} · `;
    if (f.owasp) meta += `OWASP: ${f.owasp} · `;
    if (f.cvss) meta += `CVSS: ${f.cvss} · `;
    if (f.location) meta += `位置: ${f.location}`;
    return `<div class="finding-item sev-${f.severity}" id="finding-${i}">
      <div class="finding-head" onclick="toggleFinding(${i})">
        <span class="sev-tag ${f.severity}">${lbl}</span>
        <span class="finding-title">${esc(f.title)}</span>
        <span class="finding-domain">${domLbl} · ${esc(f.category||'')}</span>
      </div>
      <div class="finding-body">
        <div class="row"><span class="row-label">描述:</span> ${esc(f.description||'无')}</div>
        ${f.evidence ? `<div class="row"><span class="row-label">证据:</span><pre>${esc(f.evidence)}</pre></div>` : ''}
        ${f.recommendation ? `<div class="row"><span class="row-label">修复建议:</span> ${esc(f.recommendation)}</div>` : ''}
        <div class="row" style="color:var(--muted);font-size:12px;">${meta}</div>
      </div>
    </div>`;
  }).join('');
}

function toggleFinding(i) {
  document.getElementById('finding-' + i).classList.toggle('open');
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function generateReport(format) {
  if (!currentAssessmentId) { toast('请先执行评估', true); return; }
  try {
    const data = await api('/report/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({assessment_id: currentAssessmentId, format}),
    });
    toast('报告已生成，开始下载...');
    window.open(data.report_url, '_blank');
  } catch(e) {
    toast('报告生成失败: ' + e.message, true);
  }
}

async function loadStats() {
  try {
    const s = await api('/stats');
    document.getElementById('systemStats').innerHTML =
      `<span class="stat-pill">评估数: ${s.total_assessments}</span>
       <span class="stat-pill">漏洞总数: ${s.total_findings}</span>
       <span class="stat-pill">严重: ${s.findings_by_severity.critical||0}</span>
       <span class="stat-pill">高危: ${s.findings_by_severity.high||0}</span>`;
  } catch(e) { toast('统计加载失败: ' + e.message, true); }
}

function loadKnowledgeTab() {
  document.getElementById('kbSection').style.display = 'block';
  window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
  loadKbTop();
}

async function loadKbTop() {
  const d = document.getElementById('kbDomain').value;
  try {
    const data = await api('/knowledge/' + d);
    document.getElementById('kbTopList').innerHTML =
      `<h4 style="color:var(--accent);margin-bottom:8px;">Top 漏洞 - ${data.domain_label}</h4>` +
      (data.items || []).map(it => `
        <div class="kb-item">
          <div class="kb-name">[${it.id}] ${esc(it.name)} <span class="sev-tag ${it.severity}" style="margin-left:6px;">${SEV_LABELS[it.severity]||it.severity}</span></div>
          <div class="kb-desc">${esc(it.description)}</div>
          <div class="kb-fix">修复: ${esc(it.fix)}</div>
        </div>`).join('');
  } catch(e) { toast('知识库加载失败: ' + e.message, true); }
}

async function searchKb() {
  const kw = document.getElementById('kbKeyword').value.trim();
  if (!kw) { toast('请输入关键词', true); return; }
  try {
    const data = await api('/knowledge/search?keyword=' + encodeURIComponent(kw));
    document.getElementById('kbSearchResult').innerHTML =
      `<h4 style="color:var(--accent);margin-bottom:8px;">搜索结果: "${kw}" (${data.total}条)</h4>` +
      (data.items || []).map(it => `
        <div class="kb-item">
          <div class="kb-name">[${it.domain_label}] ${esc(it.name)}</div>
          <div class="kb-desc">${esc(it.description)}</div>
          <div class="kb-fix">修复: ${esc(it.fix)}</div>
        </div>`).join('');
  } catch(e) { toast('搜索失败: ' + e.message, true); }
}

// 初始化
onTypeChange();
loadStats();
</script>

<!-- Round8: mobile + i18n boot -->
<div id="lang-switcher" style="position:fixed;top:10px;right:10px;z-index:1300;display:flex;gap:6px;">
  <button type="button" data-lang="zh-CN" class="lang-btn" style="min-height:44px;padding:8px 14px;background:#161b22;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;cursor:pointer;font-size:13px;">中文</button>
  <button type="button" data-lang="en-US" class="lang-btn" style="min-height:44px;padding:8px 14px;background:#161b22;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;cursor:pointer;font-size:13px;">EN</button>
</div>
<script>
(function(){
  function bindLangSwitch(){
    var btns = document.querySelectorAll('#lang-switcher .lang-btn');
    btns.forEach(function(b){
      b.addEventListener('click', function(){
        var lang = b.getAttribute('data-lang');
        if (window.i18n) window.i18n.setLanguage(lang);
      });
    });
    function highlight(){
      var cur = (window.i18n && window.i18n.getLanguage()) || 'zh-CN';
      btns.forEach(function(b){
        var active = b.getAttribute('data-lang') === cur;
        b.style.borderColor = active ? '#58a6ff' : '#30363d';
        b.style.color = active ? '#58a6ff' : '#c9d1d9';
      });
    }
    window.addEventListener('i18n:change', highlight);
    // initial highlight once i18n boots
    var tries = 0;
    var t = setInterval(function(){ if (window.i18n) { highlight(); clearInterval(t); } else if (++tries > 50) clearInterval(t); }, 100);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindLangSwitch);
  else bindLangSwitch();
})();
</script>
