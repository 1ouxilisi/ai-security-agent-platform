<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LLM 接入优化控制台</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8b93a3;
    --accent: #4f8cff;
    --green: #2ecc71;
    --red: #e74c3c;
    --yellow: #f1c40f;
    --orange: #e67e22;
    --mono: "JetBrains Mono", "Fira Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .grid { display: grid; gap: 16px; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  @media (max-width: 1100px) { .grid-3, .grid-2 { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 8px 14px; cursor: pointer; font-size: 13px;
  }
  button.ghost { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  input, textarea, select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font-size: 13px; width: 100%;
    font-family: inherit;
  }
  textarea { min-height: 80px; font-family: var(--mono); font-size: 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600;
  }
  .badge-llm { background: rgba(46,204,113,0.15); color: var(--green); }
  .badge-rule { background: rgba(241,196,15,0.15); color: var(--yellow); }
  .badge-crit { background: rgba(231,76,60,0.15); color: var(--red); }
  .badge-high { background: rgba(230,126,34,0.15); color: var(--orange); }
  .badge-med  { background: rgba(241,196,15,0.15); color: var(--yellow); }
  .badge-info { background: rgba(79,140,255,0.15); color: var(--accent); }
  pre {
    background: #0a0c10; border: 1px solid var(--border);
    border-radius: 6px; padding: 12px; overflow: auto;
    font-family: var(--mono); font-size: 12px; color: #c9d1d9;
    max-height: 400px; white-space: pre-wrap; word-break: break-all;
  }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 13px; }
  .kv .k { color: var(--muted); }
  .stat { font-size: 24px; font-weight: 700; }
  .stat-label { color: var(--muted); font-size: 12px; }
  .muted { color: var(--muted); }
  .ok { color: var(--green); }
  .err { color: var(--red); }
  .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    background: var(--panel-2); color: var(--muted); font-size: 13px;
    border: 1px solid var(--border);
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .hidden { display: none; }
  .case { border-left: 3px solid var(--border); padding: 8px 12px; margin: 8px 0; background: var(--panel-2); border-radius: 0 6px 6px 0; }
  .case.pass { border-left-color: var(--green); }
  .case.fail { border-left-color: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
</style>
</head>
<body>

<h1>LLM 接入优化控制台 <span class="badge badge-info">方向5</span></h1>
<div class="sub">确保配了 Key 后，三大 AI 功能（漏洞智能分析 / 报告自动生成 / 智能问答）真能用。无 Key 时自动走规则引擎降级。</div>

<div class="tab-bar">
  <div class="tab active" data-tab="dash">仪表盘</div>
  <div class="tab" data-tab="test">功能测试</div>
  <div class="tab" data-tab="e2e">端到端测试</div>
  <div class="tab" data-tab="prompts">Prompt 优化</div>
  <div class="tab" data-tab="history">调用历史</div>
</div>

<!-- ===================== 仪表盘 ===================== -->
<div id="tab-dash" class="tabpane">
  <div class="grid grid-3">
    <div class="card">
      <h2>配置状态</h2>
      <div class="kv" id="cfg-kv"><span class="muted">加载中...</span></div>
      <div class="row" style="margin-top:12px">
        <button onclick="loadOverview()">刷新</button>
        <button class="ghost" onclick="healthCheck()">健康检查</button>
        <button class="ghost" onclick="reloadCfg()">热重载</button>
      </div>
      <div id="hc-result" style="margin-top:10px" class="muted"></div>
    </div>
    <div class="card">
      <h2>调用统计</h2>
      <div class="kv" id="stats-kv"><span class="muted">加载中...</span></div>
    </div>
    <div class="card">
      <h2>三大功能可用性</h2>
      <div id="func-list"><span class="muted">加载中...</span></div>
    </div>
  </div>
</div>

<!-- ===================== 功能测试 ===================== -->
<div id="tab-test" class="tabpane hidden">
  <div class="grid grid-3">
    <!-- 漏洞分析 -->
    <div class="card">
      <h2>① 漏洞智能分析</h2>
      <label>漏洞描述</label>
      <textarea id="va-desc">用户登录接口 password 参数存在 SQL 注入，单引号触发 MySQL 报错</textarea>
      <label>目标</label>
      <input id="va-target" value="http://demo.testfire.net/login">
      <button style="margin-top:10px" onclick="runVulnAnalysis()">运行分析</button>
      <div id="va-out" style="margin-top:12px"></div>
    </div>
    <!-- 报告生成 -->
    <div class="card">
      <h2>② 报告自动生成</h2>
      <label>目标系统</label>
      <input id="rg-target" value="http://demo.testfire.net">
      <label>漏洞清单（JSON，留空用示例 3 条）</label>
      <textarea id="rg-vulns">[]</textarea>
      <button style="margin-top:10px" onclick="runReportGen()">生成报告</button>
      <div id="rg-out" style="margin-top:12px"></div>
    </div>
    <!-- 智能问答 -->
    <div class="card">
      <h2>③ 智能问答</h2>
      <label>问题</label>
      <textarea id="qa-q">这个网站有什么风险？</textarea>
      <label>上下文（可选）</label>
      <textarea id="qa-ctx">目标已发现：登录接口 SQL 注入、反射型 XSS、/admin 暴露</textarea>
      <button style="margin-top:10px" onclick="runSmartQA()">提问</button>
      <div id="qa-out" style="margin-top:12px"></div>
    </div>
  </div>
</div>

<!-- ===================== 端到端 ===================== -->
<div id="tab-e2e" class="tabpane hidden">
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">端到端测试（3 个标准用例）</h2>
      <div class="row">
        <button class="ghost" onclick="loadE2ELast()">加载上次结果</button>
        <button onclick="runE2E()">立即运行</button>
      </div>
    </div>
    <div id="e2e-summary" style="margin-top:12px"></div>
    <div id="e2e-cases" style="margin-top:12px"></div>
  </div>
</div>

<!-- ===================== Prompts ===================== -->
<div id="tab-prompts" class="tabpane hidden">
  <div class="card">
    <h2>Prompt 模板新旧对照</h2>
    <div id="prompt-list"></div>
    <div id="prompt-detail" style="margin-top:16px"></div>
  </div>
</div>

<!-- ===================== 历史 ===================== -->
<div id="tab-history" class="tabpane hidden">
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">调用历史</h2>
      <div class="row">
        <button class="ghost" onclick="loadHistory()">刷新</button>
        <button class="ghost" onclick="clearHistory()">清空</button>
      </div>
    </div>
    <div id="history-table" style="margin-top:12px"></div>
  </div>
</div>

<script>
const API = "/api/v1/llm-opt";

// ---------- tabs ----------
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".tabpane").forEach(x => x.classList.add("hidden"));
    t.classList.add("active");
    document.getElementById("tab-" + t.dataset.tab).classList.remove("hidden");
    if (t.dataset.tab === "dash") loadOverview();
    if (t.dataset.tab === "prompts") loadPrompts();
    if (t.dataset.tab === "history") loadHistory();
    if (t.dataset.tab === "e2e") loadE2ELast();
  };
});

async function api(path, opts) {
  const r = await fetch(API + path, opts);
  return r.json();
}
function esc(s) {
  return (s || "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}
function modeBadge(m, label) {
  return `<span class="badge ${m === "llm" ? "badge-llm" : "badge-rule"}">${label || (m === "llm" ? "LLM 模式" : "规则模式（未配置LLM）")}</span>`;
}

// ---------- dashboard ----------
async function loadOverview() {
  const d = await api("/overview");
  const data = d.data || {};
  // config
  const cfg = data.config || {};
  document.getElementById("cfg-kv").innerHTML = `
    <span class="k">已配置</span><span class="${cfg.configured ? "ok" : "err"}">${cfg.configured ? "是" : "否"}</span>
    <span class="k">Provider</span><span>${esc(cfg.provider_hint || cfg.provider || "-")}</span>
    <span class="k">Model</span><span>${esc(cfg.model || "-")}</span>
    <span class="k">Base URL</span><span style="font-family:var(--mono);font-size:11px">${esc(cfg.base_url || "-")}</span>
    <span class="k">Key</span><span style="font-family:var(--mono)">${esc(cfg.api_key_masked || "(空)")}</span>
    <span class="k">消息</span><span class="muted">${esc(cfg.message || "")}</span>`;
  // stats
  const s = data.stats || {};
  document.getElementById("stats-kv").innerHTML = `
    <span class="k">总调用</span><span class="stat">${s.total_calls || 0}</span>
    <span class="k">LLM 调用</span><span class="ok">${s.llm_calls || 0}</span>
    <span class="k">规则降级</span><span class="muted">${s.rule_calls || 0}</span>
    <span class="k">失败降级</span><span class="err">${s.fallback_calls || 0}</span>
    <span class="k">平均延迟</span><span>${s.avg_latency_ms || 0} ms</span>`;
  // functions
  const fns = data.functions || [];
  document.getElementById("func-list").innerHTML = fns.map(f => `
    <div style="padding:8px 0;border-bottom:1px solid var(--border)">
      <div class="row" style="justify-content:space-between">
        <b>${esc(f.name)}</b>
        ${modeBadge(f.status)}
      </div>
      <div class="muted" style="font-size:12px">${esc(f.desc)}</div>
    </div>`).join("");
}

async function healthCheck() {
  const out = document.getElementById("hc-result");
  out.textContent = "检查中...";
  const d = await api("/health-check", {method: "POST"});
  out.innerHTML = d.success
    ? `<span class="ok">✓ ${esc(d.data?.message || "正常")}</span>`
    : `<span class="err">✗ ${esc(d.error || "失败")}</span>`;
}
async function reloadCfg() {
  const d = await api("/reload", {method: "POST"});
  alert(d.success ? "已热重载，新配置立即生效" : ("重载失败: " + d.error));
  loadOverview();
}

// ---------- tests ----------
async function runVulnAnalysis() {
  const out = document.getElementById("va-out");
  out.innerHTML = '<span class="muted">分析中...</span>';
  const d = await api("/test/vuln-analysis", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      vuln_description: document.getElementById("va-desc").value,
      target: document.getElementById("va-target").value,
    }),
  });
  if (!d.success) { out.innerHTML = `<span class="err">${esc(d.error)}</span>`; return; }
  const r = d.data, res = r.result || {};
  out.innerHTML = `
    ${modeBadge(r.mode)} ${r.latency_ms} ms ${r.model ? "· " + esc(r.model) : ""}
    <div class="kv" style="margin-top:8px">
      <span class="k">类型</span><span>${esc(res.vuln_type)}</span>
      <span class="k">严重度</span><span class="badge badge-${(res.severity||"info")}">${esc(res.severity||"")}</span>
      <span class="k">CVSS</span><span>${res.cvss_score}</span>
      <span class="k">置信度</span><span>${res.confidence}</span>
      <span class="k">根因</span><span>${esc(res.root_cause)}</span>
    </div>
    <pre>${esc(JSON.stringify(res, null, 2))}</pre>`;
}

async function runReportGen() {
  const out = document.getElementById("rg-out");
  out.innerHTML = '<span class="muted">生成中...</span>';
  let vulns = [];
  try { vulns = JSON.parse(document.getElementById("rg-vulns").value || "[]"); } catch(e) {}
  const d = await api("/test/report-generation", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ target: document.getElementById("rg-target").value, vulns }),
  });
  if (!d.success) { out.innerHTML = `<span class="err">${esc(d.error)}</span>`; return; }
  const r = d.data, res = r.result || {};
  out.innerHTML = `
    ${modeBadge(r.mode)} ${r.latency_ms} ms · ${res.vuln_count} 个漏洞
    <pre>${esc(res.report_markdown || "")}</pre>`;
}

async function runSmartQA() {
  const out = document.getElementById("qa-out");
  out.innerHTML = '<span class="muted">回答中...</span>';
  const d = await api("/test/smart-qa", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      question: document.getElementById("qa-q").value,
      context: document.getElementById("qa-ctx").value,
    }),
  });
  if (!d.success) { out.innerHTML = `<span class="err">${esc(d.error)}</span>`; return; }
  const r = d.data, res = r.result || {};
  out.innerHTML = `
    ${modeBadge(r.mode)} ${r.latency_ms} ms
    <pre>${esc(res.answer || "")}</pre>`;
}

// ---------- e2e ----------
async function runE2E() {
  document.getElementById("e2e-summary").innerHTML = '<span class="muted">运行中...</span>';
  document.getElementById("e2e-cases").innerHTML = "";
  const d = await api("/e2e-run", {method: "POST"});
  if (!d.success) { document.getElementById("e2e-summary").innerHTML = `<span class="err">${esc(d.error)}</span>`; return; }
  renderE2E(d.data);
}
async function loadE2ELast() {
  const d = await api("/e2e-last");
  if (d.data && d.data.summary) renderE2E(d.data);
  else document.getElementById("e2e-summary").innerHTML = '<span class="muted">尚未运行过 e2e 测试</span>';
}
function renderE2E(data) {
  const s = data.summary;
  document.getElementById("e2e-summary").innerHTML = `
    <div class="grid grid-3">
      <div><div class="stat ${s.passed === s.total ? "ok" : "err"}">${s.passed}/${s.total}</div><div class="stat-label">通过用例</div></div>
      <div><div class="stat">${s.llm_cases}</div><div class="stat-label">走 LLM</div></div>
      <div><div class="stat">${s.rule_cases}</div><div class="stat-label">走规则</div></div>
    </div>`;
  document.getElementById("e2e-cases").innerHTML = (data.cases || []).map(c => `
    <div class="case ${c.passed ? "pass" : "fail"}">
      <div class="row" style="justify-content:space-between">
        <b>${c.passed ? "✓" : "✗"} ${esc(c.title)}</b>
        ${modeBadge(c.mode, c.mode_label)} · ${c.latency_ms} ms
      </div>
      ${c.error ? `<div class="err" style="font-size:12px">${esc(c.error)}</div>` : ""}
      ${c.report_preview ? `<pre>${esc(c.report_preview)}</pre>` : ""}
      ${c.answer_preview ? `<pre>${esc(c.answer_preview)}</pre>` : ""}
      ${c.key_fields ? `<pre>${esc(JSON.stringify(c.key_fields, null, 2))}</pre>` : ""}
    </div>`).join("");
}

// ---------- prompts ----------
async function loadPrompts() {
  const d = await api("/prompts");
  const list = (d.data && d.data.prompts) || [];
  document.getElementById("prompt-list").innerHTML = list.map(p => `
    <div class="case" style="cursor:pointer" onclick="loadPromptDetail('${p.key}')">
      <div class="row" style="justify-content:space-between">
        <b>${esc(p.name)}</b>
        <span class="muted">${p.old_length} → ${p.new_length} 字符</span>
      </div>
      <div class="muted" style="font-size:12px">${esc(p.scene)}</div>
    </div>`).join("");
}
async function loadPromptDetail(key) {
  const d = await api("/prompts/" + key);
  if (!d.success) return;
  const p = d.data;
  document.getElementById("prompt-detail").innerHTML = `
    <h2>${esc(p.name)} Prompt 对照</h2>
    <label>旧版（${p.old_prompt.length} 字符）</label>
    <pre>${esc(p.old_prompt)}</pre>
    <label>新版（${p.new_prompt.length} 字符）</label>
    <pre>${esc(p.new_prompt)}</pre>
    <label>优化点</label>
    <ul>${(p.diff_notes || []).map(n => `<li>${esc(n)}</li>`).join("")}</ul>`;
}

// ---------- history ----------
async function loadHistory() {
  const d = await api("/history?limit=50");
  const items = (d.data && d.data.items) || [];
  if (!items.length) { document.getElementById("history-table").innerHTML = '<span class="muted">暂无记录</span>'; return; }
  document.getElementById("history-table").innerHTML = `
    <table>
      <tr><th>时间</th><th>场景</th><th>模式</th><th>延迟</th><th>模型</th><th>降级</th></tr>
      ${items.slice().reverse().map(h => `
        <tr>
          <td>${esc(h.ts || "")}</td>
          <td>${esc(h.scene || "")}</td>
          <td>${modeBadge(h.mode, h.mode_label)}</td>
          <td>${h.latency_ms} ms</td>
          <td>${esc(h.model || "-")}</td>
          <td>${h.fallback ? "是" : "否"}</td>
        </tr>`).join("")}
    </table>`;
}
async function clearHistory() {
  await api("/history", {method: "DELETE"});
  loadHistory();
}

// init
loadOverview();
</script>
</body>
</html>
