<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能体 - AI全栈安全平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 20px 40px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; color: #38bdf8; }
        .header .nav { display: flex; gap: 20px; }
        .header .nav a { color: #94a3b8; text-decoration: none; font-size: 14px; }
        .header .nav a:hover { color: #38bdf8; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 40px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        .stat-card .label { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #38bdf8; }
        .panel { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; margin-bottom: 20px; }
        .panel h2 { font-size: 18px; color: #f1f5f9; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #334155; }
        .btn { background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); color: white; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        input, select { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 10px 14px; border-radius: 8px; font-size: 14px; width: 100%; }
        input:focus, select:focus { outline: none; border-color: #0ea5e9; }
        .form-row { display: flex; gap: 12px; margin-bottom: 16px; }
        .form-row > div { flex: 1; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; font-size: 13px; font-weight: 500; }
        td { font-size: 14px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-critical { background: #7f1d1d; color: #fca5a5; }
        .badge-high { background: #7c2d12; color: #fdba74; }
        .badge-medium { background: #713f12; color: #fde047; }
        .badge-low { background: #14532d; color: #86efac; }
        .badge-info { background: #1e3a5f; color: #7dd3fc; }
        .loading { display: none; text-align: center; padding: 40px; color: #94a3b8; }
        .loading.active { display: block; }
        .spinner { border: 3px solid #334155; border-top: 3px solid #0ea5e9; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .empty { text-align: center; padding: 40px; color: #64748b; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 AI智能体</h1>
        <div class="nav">
            <a href="/dashboard">仪表盘</a>
            <a href="/console">控制台</a>
            <a href="/vuln-database">漏洞库</a>
            <a href="/ai-assistant">AI助手</a>
        </div>
    </div>
    <div class="container">
        <p style="color: #94a3b8; margin-bottom: 24px;">4大AI智能体协作：侦察专家、漏洞测试专家、验证专家、报告专家，支持ReAct推理</p>
        <div id="stats" class="stats-grid"></div>
        <div id="content"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>
    </div>
    <script>
        const API_KEY = "cF_fK3wzzFd3sDU-WykQzDbAKNhn_Jjoyphbmh-adLtwx5ShhU8oLpt94aV_uECT";
        const API_BASE = "http://127.0.0.1:8000";
        
        async function apiCall(endpoint, options = {}) {
            const headers = { "X-API-Key": API_KEY, "Content-Type": "application/json", ...options.headers };
            const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
            return res.json();
        }
        
        function showLoading() { document.getElementById("loading").classList.add("active"); }
        function hideLoading() { document.getElementById("loading").classList.remove("active"); }
        
        
async function loadAgents() {
    showLoading();
    try {
        const data = await apiCall("/api/v1/agents");
        document.getElementById("stats").innerHTML = `
            <div class="stat-card"><div class="label">智能体总数</div><div class="value">${data.total}</div></div>
            <div class="stat-card"><div class="label">侦察智能体</div><div class="value">1</div></div>
            <div class="stat-card"><div class="label">漏洞利用</div><div class="value">1</div></div>
            <div class="stat-card"><div class="label">报告生成</div><div class="value">1</div></div>
        `;
        
        let html = `<div class="panel"><h2>智能体列表</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;">`;
        data.agents.forEach(a => {
            html += `<div style="background:#0f172a;padding:20px;border-radius:10px;border:1px solid #334155;">
                <h3 style="color:#38bdf8;margin-bottom:8px;">${a.name}</h3>
                <p style="color:#94a3b8;font-size:14px;margin-bottom:12px;">${a.role}</p>
                <p style="color:#64748b;font-size:13px;margin-bottom:16px;">${a.description}</p>
                <button class="btn" onclick="runAgent('${a.name}')">启动智能体</button>
            </div>`;
        });
        html += `</div></div>`;
        
        html += `<div class="panel"><h2>ReAct推理测试</h2>
            <div class="form-row"><div><input id="agentQuery" placeholder="输入任务，如：扫描127.0.0.1的开放端口" value="扫描127.0.0.1的开放端口"></div>
            <button class="btn" onclick="runReAct()">执行推理</button></div>
            <div id="reactResult" style="background:#0f172a;padding:16px;border-radius:8px;white-space:pre-wrap;font-size:13px;color:#94a3b8;min-height:100px;">等待执行...</div>
        </div>`;
        
        document.getElementById("content").innerHTML = html;
    } catch(e) {
        document.getElementById("content").innerHTML = `<div class="empty">加载失败: ${e.message}</div>`;
    }
    hideLoading();
}

async function runAgent(name) {
    alert(`智能体 ${name} 已启动（演示模式）`);
}

async function runReAct() {
    const query = document.getElementById("agentQuery").value;
    document.getElementById("reactResult").textContent = "推理中...";
    try {
        const result = await apiCall("/api/v1/agents/react", {
            method: "POST",
            body: JSON.stringify({ query: query, max_steps: 5 })
        });
        document.getElementById("reactResult").textContent = JSON.stringify(result, null, 2);
    } catch(e) {
        document.getElementById("reactResult").textContent = `执行失败: ${e.message}\n可能需要配置LLM API Key`;
    }
}

loadAgents();

    </script>
</body>
</html>
