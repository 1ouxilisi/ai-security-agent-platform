<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI全栈安全渗透测试平台 - 12领域作战控制台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  background: #0a0e17;
  color: #e0e6ed;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 100%);
  border-bottom: 2px solid #00d4ff;
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header h1 {
  font-size: 24px;
  color: #00d4ff;
  letter-spacing: 2px;
}
.header .stats {
  display: flex;
  gap: 30px;
}
.header .stat {
  text-align: center;
}
.header .stat .num {
  font-size: 28px;
  font-weight: bold;
  color: #00ff88;
}
.header .stat .label {
  font-size: 12px;
  color: #8899aa;
}
.container {
  padding: 30px 40px;
  max-width: 1600px;
  margin: 0 auto;
}
.section-title {
  font-size: 18px;
  color: #00d4ff;
  margin-bottom: 20px;
  padding-left: 12px;
  border-left: 4px solid #00d4ff;
}
.domains-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 40px;
}
.domain-card {
  background: linear-gradient(135deg, #141c2b 0%, #1a2332 100%);
  border: 1px solid #2a3a4e;
  border-radius: 12px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.domain-card:hover {
  border-color: #00d4ff;
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(0, 212, 255, 0.2);
}
.domain-card.active {
  border-color: #00ff88;
  box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
}
.domain-card .icon {
  font-size: 32px;
  margin-bottom: 10px;
}
.domain-card .name {
  font-size: 16px;
  font-weight: bold;
  color: #fff;
  margin-bottom: 6px;
}
.domain-card .desc {
  font-size: 12px;
  color: #8899aa;
  margin-bottom: 12px;
  line-height: 1.5;
}
.domain-card .meta {
  display: flex;
  gap: 12px;
  font-size: 11px;
}
.domain-card .meta span {
  background: #1e2a3a;
  padding: 3px 8px;
  border-radius: 4px;
  color: #aabbcc;
}
.domain-card .risk-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 3px;
  background: #00ff88;
  transition: width 0.5s;
}
.control-panel {
  background: #141c2b;
  border: 1px solid #2a3a4e;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 30px;
}
.control-row {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
}
.control-row input[type="text"] {
  flex: 1;
  min-width: 300px;
  padding: 12px 16px;
  background: #0d1420;
  border: 1px solid #2a3a4e;
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
}
.control-row input[type="text"]:focus {
  outline: none;
  border-color: #00d4ff;
}
.btn {
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
}
.btn-primary {
  background: linear-gradient(135deg, #00d4ff, #0099cc);
  color: #000;
}
.btn-primary:hover {
  box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
  transform: translateY(-1px);
}
.btn-success {
  background: linear-gradient(135deg, #00ff88, #00cc66);
  color: #000;
}
.btn-success:hover {
  box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4);
}
.btn-danger {
  background: linear-gradient(135deg, #ff4466, #cc2244);
  color: #fff;
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.results-panel {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 30px;
}
.panel {
  background: #141c2b;
  border: 1px solid #2a3a4e;
  border-radius: 12px;
  padding: 20px;
  max-height: 500px;
  overflow-y: auto;
}
.panel h3 {
  color: #00d4ff;
  font-size: 16px;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid #2a3a4e;
}
.finding-item {
  background: #0d1420;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
  border-left: 3px solid #666;
}
.finding-item.critical { border-left-color: #ff4466; }
.finding-item.high { border-left-color: #ff8844; }
.finding-item.medium { border-left-color: #ffcc00; }
.finding-item.low { border-left-color: #00d4ff; }
.finding-item.info { border-left-color: #8899aa; }
.finding-item .f-type {
  font-size: 11px;
  color: #8899aa;
  text-transform: uppercase;
}
.finding-item .f-name {
  font-size: 14px;
  color: #fff;
  margin: 4px 0;
}
.finding-item .f-sev {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: bold;
}
.f-sev.critical { background: #ff4466; color: #fff; }
.f-sev.high { background: #ff8844; color: #000; }
.f-sev.medium { background: #ffcc00; color: #000; }
.f-sev.low { background: #00d4ff; color: #000; }
.f-sev.info { background: #8899aa; color: #000; }
.chain-item {
  background: #0d1420;
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #2a3a4e;
}
.chain-item .chain-name {
  font-size: 14px;
  color: #fff;
  font-weight: bold;
  margin-bottom: 6px;
}
.chain-item .chain-domains {
  font-size: 11px;
  color: #00d4ff;
  margin-bottom: 6px;
}
.chain-item .chain-desc {
  font-size: 12px;
  color: #8899aa;
  line-height: 1.5;
}
.risk-gauge {
  text-align: center;
  padding: 20px;
}
.risk-gauge .score {
  font-size: 64px;
  font-weight: bold;
  color: #00ff88;
}
.risk-gauge .score-label {
  font-size: 14px;
  color: #8899aa;
}
.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
}
.tool-item {
  background: #0d1420;
  border-radius: 6px;
  padding: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tool-item .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.tool-item .dot.installed { background: #00ff88; }
.tool-item .dot.missing { background: #ff4466; }
.tool-item .t-name {
  font-size: 12px;
  color: #ccc;
}
.log-panel {
  background: #0d1420;
  border: 1px solid #2a3a4e;
  border-radius: 12px;
  padding: 20px;
  margin-top: 20px;
  max-height: 300px;
  overflow-y: auto;
  font-family: 'Consolas', monospace;
  font-size: 12px;
}
.log-line {
  padding: 2px 0;
  color: #8899aa;
}
.log-line.success { color: #00ff88; }
.log-line.error { color: #ff4466; }
.log-line.info { color: #00d4ff; }
.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid #2a3a4e;
  border-top-color: #00d4ff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.domain-icons {
  display: inline-block;
  width: 40px;
  height: 40px;
  line-height: 40px;
  text-align: center;
  background: #1e2a3a;
  border-radius: 8px;
  font-size: 20px;
}
</style>
</head>
<body>

<div class="header">
  <h1>⚡ AI全栈安全渗透测试平台 | 12领域作战控制台 v2.0</h1>
  <div class="stats">
    <div class="stat"><div class="num" id="stat-domains">12</div><div class="label">安全领域</div></div>
    <div class="stat"><div class="num" id="stat-agents">59</div><div class="label">专家Agent</div></div>
    <div class="stat"><div class="num" id="stat-tools">186</div><div class="label">安全工具</div></div>
    <div class="stat"><div class="num" id="stat-caps">285</div><div class="label">专业能力</div></div>
    <div class="stat"><div class="num" id="stat-chains">12</div><div class="label">攻击链</div></div>
  </div>
</div>

<div class="container">

  <!-- 12领域卡片 -->
  <div class="section-title">🎯 12大安全领域编队</div>
  <div class="domains-grid" id="domains-grid"></div>

  <!-- 控制面板 -->
  <div class="section-title">🚀 作战控制</div>
  <div class="control-panel">
    <div class="control-row">
      <input type="text" id="target-input" placeholder="输入目标（域名/IP/APK路径/合约地址...）" value="example.com">
      <button class="btn btn-primary" onclick="executeSingle()">🎯 单领域评估</button>
      <button class="btn btn-success" onclick="executeFireteam()">🔥 全领域Fireteam</button>
      <button class="btn btn-danger" onclick="loadTools()">🔧 检测工具</button>
    </div>
    <div style="margin-top:12px; font-size:12px; color:#8899aa;">
      当前选中领域：<span id="selected-domain" style="color:#00ff88; font-weight:bold;">web_security</span>
      &nbsp;|&nbsp; 模式：<span style="color:#00d4ff;">模拟执行 (dry_run)</span>
    </div>
  </div>

  <!-- 结果面板 -->
  <div class="results-panel">
    <div class="panel">
      <h3>📊 风险评估</h3>
      <div class="risk-gauge">
        <div class="score" id="risk-score">--</div>
        <div class="score-label">总体风险评分 / 100</div>
      </div>
      <div style="text-align:center; margin-top:10px; font-size:13px; color:#8899aa;">
        发现总数：<span id="findings-count" style="color:#fff; font-weight:bold;">0</span>
        &nbsp;|&nbsp; 执行领域：<span id="domains-executed" style="color:#fff; font-weight:bold;">0</span>
      </div>
    </div>
    <div class="panel">
      <h3>🔗 跨领域攻击链</h3>
      <div id="chains-list">
        <div style="color:#666; text-align:center; padding:40px;">执行Fireteam后显示攻击链</div>
      </div>
    </div>
  </div>

  <!-- 发现列表 -->
  <div class="panel" style="margin-bottom:30px;">
    <h3>🔍 安全发现详情</h3>
    <div id="findings-list">
      <div style="color:#666; text-align:center; padding:40px;">执行评估后显示发现详情</div>
    </div>
  </div>

  <!-- 工具检测 -->
  <div class="panel" style="margin-bottom:30px;">
    <h3>🔧 真实工具安装状态</h3>
    <div id="tools-panel">
      <div style="color:#666; text-align:center; padding:20px;">点击"检测工具"按钮查看</div>
    </div>
  </div>

  <!-- 执行日志 -->
  <div class="log-panel" id="log-panel">
    <div class="log-line info">[系统] 12领域作战控制台已就绪，等待指令...</div>
  </div>

</div>

<script>
const DOMAINS = [
  { id: 'web_security', name: 'Web应用安全', icon: '🌐', desc: 'SQL注入/XSS/CSRF/SSRF/目录遍历', agents: 6, tools: 20 },
  { id: 'mobile_security', name: '移动应用安全', icon: '📱', desc: 'APK逆向/Frida/污点分析/组件暴露', agents: 5, tools: 17 },
  { id: 'cloud_security', name: '云原生安全', icon: '☁️', desc: 'S3配置/IAM权限/容器/K8s渗透', agents: 5, tools: 13 },
  { id: 'blockchain_security', name: '区块链安全', icon: '⛓️', desc: '智能合约审计/重入/权限/预言机', agents: 5, tools: 12 },
  { id: 'ai_security', name: 'AI/大模型安全', icon: '🤖', desc: '提示注入/模型越狱/数据投毒/API滥用', agents: 5, tools: 12 },
  { id: 'internal_pentest', name: '内网渗透/AD', icon: '🏢', desc: 'Kerberoasting/DC Sync/黄金票据/横向移动', agents: 5, tools: 13 },
  { id: 'binary_reverse', name: '二进制逆向', icon: '🔬', desc: '反汇编/ROP/栈溢出/YARA/恶意软件分析', agents: 5, tools: 24 },
  { id: 'wireless_security', name: '无线网络安全', icon: '📡', desc: 'WPA破解/Evil Twin/KRACK/蓝牙NFC', agents: 4, tools: 14 },
  { id: 'ics_scada_security', name: '工控ICS/SCADA', icon: '🏭', desc: 'Modbus/S7/PLC控制/模糊测试/IEC62443', agents: 5, tools: 16 },
  { id: 'iot_security', name: '物联网IoT', icon: '📟', desc: '固件漏洞/硬编码/MQTT/UART/Mirai僵尸网络', agents: 5, tools: 15 },
  { id: 'social_engineering', name: '社会工程学', icon: '🎭', desc: '鱼叉钓鱼/OSINT/pretext/安全意识评估', agents: 4, tools: 12 },
  { id: 'digital_forensics', name: '数字取证', icon: '🔍', desc: '内存取证/证据链/事件重建/攻击溯源', agents: 5, tools: 18 },
];

let selectedDomain = 'web_security';

function renderDomains() {
  const grid = document.getElementById('domains-grid');
  grid.innerHTML = DOMAINS.map(d => `
    <div class="domain-card ${d.id === selectedDomain ? 'active' : ''}" onclick="selectDomain('${d.id}')">
      <div class="domain-icons">${d.icon}</div>
      <div class="name">${d.name}</div>
      <div class="desc">${d.desc}</div>
      <div class="meta">
        <span>${d.agents} Agent</span>
        <span>${d.tools} 工具</span>
      </div>
      <div class="risk-bar" style="width: ${(d.agents / 6) * 100}%"></div>
    </div>
  `).join('');
}

function selectDomain(id) {
  selectedDomain = id;
  document.getElementById('selected-domain').textContent = id;
  renderDomains();
  log(`已选择领域: ${id}`, 'info');
}

function log(msg, type = '') {
  const panel = document.getElementById('log-panel');
  const time = new Date().toLocaleTimeString();
  panel.innerHTML += `<div class="log-line ${type}">[${time}] ${msg}</div>`;
  panel.scrollTop = panel.scrollHeight;
}

async function executeSingle() {
  const target = document.getElementById('target-input').value;
  if (!target) { alert('请输入目标'); return; }
  log(`开始单领域评估: ${selectedDomain} -> ${target}`, 'info');
  try {
    const res = await fetch('/api/v1/multi-domain/execute/single', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ domain: selectedDomain, target, dry_run: true })
    });
    const data = await res.json();
    if (data.success) {
      const d = data.data;
      document.getElementById('risk-score').textContent = d.risk_score.toFixed(1);
      document.getElementById('findings-count').textContent = d.findings_count;
      document.getElementById('domains-executed').textContent = '1';
      renderFindings(d.findings);
      log(`评估完成: ${d.findings_count}个发现, 风险${d.risk_score.toFixed(1)}`, 'success');
    }
  } catch (e) {
    log(`错误: ${e.message}`, 'error');
  }
}

async function executeFireteam() {
  const target = document.getElementById('target-input').value;
  if (!target) { alert('请输入目标'); return; }
  log('🔥 启动全领域Fireteam...', 'info');
  const targets = {};
  DOMAINS.forEach(d => targets[d.id] = target);
  try {
    const res = await fetch('/api/v1/multi-domain/execute/fireteam', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ targets, dry_run: true })
    });
    const data = await res.json();
    if (data.success) {
      const d = data.data;
      document.getElementById('risk-score').textContent = d.overall_risk_score.toFixed(1);
      document.getElementById('findings-count').textContent = d.total_findings;
      document.getElementById('domains-executed').textContent = d.domains_executed;
      renderFindings(d.all_findings);
      renderChains(d.cross_domain_chains);
      log(`Fireteam完成: ${d.domains_executed}领域, ${d.total_findings}发现, ${d.cross_domain_chains.length}条攻击链`, 'success');
    }
  } catch (e) {
    log(`错误: ${e.message}`, 'error');
  }
}

function renderFindings(findings) {
  const list = document.getElementById('findings-list');
  if (!findings || findings.length === 0) {
    list.innerHTML = '<div style="color:#666; text-align:center; padding:20px;">无发现</div>';
    return;
  }
  list.innerHTML = findings.slice(0, 30).map(f => {
    const sev = f.severity || 'info';
    const name = f.name || f.type || '未知';
    return `
      <div class="finding-item ${sev}">
        <span class="f-type">${f.type || 'unknown'}</span>
        <span class="f-sev ${sev}">${sev.toUpperCase()}</span>
        <div class="f-name">${name}</div>
        ${f.location ? `<div style="font-size:11px;color:#8899aa;">位置: ${f.location}</div>` : ''}
        ${f.cvss ? `<div style="font-size:11px;color:#ff8844;">CVSS: ${f.cvss}</div>` : ''}
        ${f.domain ? `<div style="font-size:10px;color:#666;">领域: ${f.domain} | Agent: ${f.agent_role || ''}</div>` : ''}
      </div>
    `;
  }).join('');
}

function renderChains(chains) {
  const list = document.getElementById('chains-list');
  if (!chains || chains.length === 0) {
    list.innerHTML = '<div style="color:#666; text-align:center; padding:20px;">未检测到跨领域攻击链</div>';
    return;
  }
  list.innerHTML = chains.map(c => `
    <div class="chain-item">
      <div class="chain-name">${c.chain}</div>
      <div class="chain-domains">${(c.domains || []).join(' → ')}</div>
      <div class="chain-desc">${c.description || ''}</div>
      <div style="margin-top:6px;"><span class="f-sev ${c.severity}">${c.severity.toUpperCase()}</span></div>
    </div>
  `).join('');
}

async function loadTools() {
  log('检测系统中安装的安全工具...', 'info');
  try {
    const res = await fetch('/api/v1/multi-domain/tools/status');
    const data = await res.json();
    if (data.success) {
      const d = data.data;
      const panel = document.getElementById('tools-panel');
      let html = `<div style="margin-bottom:16px; font-size:14px;">
        操作系统: <b>${d.os}</b> | 
        工具总数: <b>${d.total_tools}</b> | 
        已安装: <b style="color:#00ff88;">${d.installed_tools}</b> | 
        覆盖率: <b style="color:#00d4ff;">${d.coverage}%</b>
      </div>`;
      html += '<div class="tools-grid">';
      for (const [domain, cov] of Object.entries(d.domain_coverage)) {
        const domainInfo = DOMAINS.find(x => x.id === domain);
        const name = domainInfo ? domainInfo.name : domain;
        html += `
          <div class="tool-item" style="flex-direction:column; align-items:flex-start;">
            <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">
              <span class="dot ${cov.installed > 0 ? 'installed' : 'missing'}"></span>
              <span class="t-name" style="font-weight:bold;">${name}</span>
            </div>
            <div style="font-size:10px; color:#8899aa;">${cov.installed}/${cov.total} (${cov.coverage}%)</div>
            <div style="font-size:10px; color:#666; margin-top:2px;">${cov.installed_tools.join(', ') || '无'}</div>
          </div>
        `;
      }
      html += '</div>';
      panel.innerHTML = html;
      log(`工具检测完成: ${d.installed_tools}/${d.total_tools} 已安装`, 'success');
    }
  } catch (e) {
    log(`错误: ${e.message}`, 'error');
  }
}

renderDomains();
log('控制台初始化完成，12大领域已就绪', 'success');
</script>
</body>
</html>
