# =============================================================================
# Kubernetes Secret - SecurityAI Platform (敏感配置)
# !!! 重要: 以下所有值均为 base64 编码的占位符，部署前必须替换 !!!
#
# 生成 base64 值的方法:
#   echo -n "your-actual-password" | base64
#
# 示例:
#   echo -n "MySecurePassword123" | base64
#   → TXlTZWN1cmVQYXNzd29yZDEyMw==
#
# 使用方式: kubectl apply -f secret.yaml
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: security-platform-secret
  namespace: security-platform
  labels:
    app: security-platform
type: Opaque
data:
  # ---------------------------------------------------------------------------
  # 数据库连接串: postgresql://用户:密码@数据库地址:5432/库名
  # 占位符: cG9zdGdyZXNxbDovL3NlY3VyaXR5X2FkbWluOkNUQU5HRV9NRV9EQi5QQVNTV09SQEBZGI6NTQzMi9zZWN1cml0eV9wbGF0Zm9ybQ==
  # 解码后: postgresql://security_admin:CHANGE_ME_DB_PASSWORD@db:5432/security_platform
  # ---------------------------------------------------------------------------
  DATABASE_URL: "cG9zdGdyZXNxbDovL3NlY3VyaXR5X2FkbWluOkNUQU5HRV9NRV9EQi5QQVNTV09SQEBZGI6NTQzMi9zZWN1cml0eV9wbGF0Zm9ybQ=="

  # ---------------------------------------------------------------------------
  # Redis 连接串: redis://:密码@redis地址:6379/数据库编号
  # 占位符: cmVkaXM6Ly86Q0hBTkdFX01FX1JFRElTX1BBU1NXT1JEQHJlZGlzOjYzNzkvMA==
  # 解码后: redis://:CHANGE_ME_REDIS_PASSWORD@redis:6379/0
  # ---------------------------------------------------------------------------
  REDIS_URL: "cmVkaXM6Ly86Q0hBTkdFX01FX1JFRElTX1BBU1NXT1JEQHJlZGlzOjYzNzkvMA=="

  # ---------------------------------------------------------------------------
  # JWT 签名密钥 (生产环境必须替换为高强度随机字符串)
  # 建议: openssl rand -hex 32 生成 64 字符随机密钥
  # 占位符: Q0hBTkdFX01FX0pXVF9TRUNSRVRfS0VZXzMyX2NoYXJzX2xvbmchISE=
  # 解码后: CHANGE_ME_JWT_SECRET_KEY_32_chars_long!!!
  # ---------------------------------------------------------------------------
  JWT_SECRET_KEY: "Q0hBTkdFX01FX0pXVF9TRUNSRVRfS0VZXzMyX2NoYXJzX2xvbmchISE="

  # ---------------------------------------------------------------------------
  # 数据加密主密钥 (用于加密敏感数据落盘)
  # 建议: openssl rand -hex 32 生成
  # 占位符: Q0hBTkdFX01FX0VOQ1JZUFRJT05fTUFTVEVSX0tFWSEhIQ==
  # 解码后: CHANGE_ME_ENCRYPTION_MASTER_KEY!!!
  # ---------------------------------------------------------------------------
  ENCRYPTION_MASTER_KEY: "Q0hBTkdFX01FX0VOQ1JZUFRJT05fTUFTVEVSX0tFWSEhIQ=="

  # ---------------------------------------------------------------------------
  # API 认证 Key (调用 API 时在 Header 中传入 X-API-Key)
  # 占位符: Q0hBTkdFX01FX0FQSV9BVVRIX0tFWSEhIQ==
  # 解码后: CHANGE_ME_API_AUTH_KEY!!!
  # ---------------------------------------------------------------------------
  API_AUTH_KEY: "Q0hBTkdFX01FX0FQSV9BVVRIX0tFWSEhIQ=="

  # ---------------------------------------------------------------------------
  # LLM 大模型 API Key
  # 占位符: Q0hBTkdFX01FX0xMTV9BUElMS0VZISE=
  # 解码后: CHANGE_ME_LLM_API_KEY!!
  # ---------------------------------------------------------------------------
  LLM_API_KEY: "Q0hBTkdFX01FX0xMTV9BUElMS0VZISE="

  # ---------------------------------------------------------------------------
  # PostgreSQL 独立密码 (供 init 脚本/备份使用)
  # 占位符: Q0hBTkdFX01FX1BFUkdfUEFTU1dPUkQhIQ==
  # 解码后: CHANGE_ME_PG_PASSWORD!!
  # ---------------------------------------------------------------------------
  POSTGRES_PASSWORD: "Q0hBTkdFX01FX1BFUkdfUEFTU1dPUkQhIQ=="
