# =============================================================================
# Kubernetes Service - SecurityAI Platform
# ClusterIP 类型，仅集群内部可访问，由 Ingress 暴露到外部
# 使用方式: kubectl apply -f service.yaml
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: security-platform-service
  namespace: security-platform
  labels:
    app: security-platform
    tier: backend
  annotations:
    # Prometheus 服务发现注解
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: /metrics
spec:
  # 类型: ClusterIP (仅集群内部访问，通过 Ingress 对外暴露)
  type: ClusterIP

  # 选择器: 匹配 Deployment 创建的 Pod 标签
  selector:
    app: security-platform
    tier: backend

  # 端口映射: Service 端口 8000 → Pod 端口 8000
  ports:
    - name: http
      port: 8000           # Service 暴露的端口
      targetPort: 8000     # Pod 容器端口
      protocol: TCP

  # 会话保持: 基于客户端 IP，保持 10 分钟会话粘性
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 600
