# =============================================================================
# Kubernetes Deployment - SecurityAI Platform
# 部署 3 个副本，滚动更新策略，资源限制 + 健康探针
# 使用方式: kubectl apply -f deployment.yaml
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-platform-app
  namespace: security-platform
  labels:
    app: security-platform
    tier: backend
    version: v1.0.0
spec:
  # 副本数: 3 个应用实例，保障高可用
  replicas: 3

  # 滚动更新策略: 最大 surge=1 (多起1个)，maxUnavailable=0 (不中断服务)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # 选择器: 匹配 Pod 标签
  selector:
    matchLabels:
      app: security-platform
      tier: backend

  template:
    metadata:
      labels:
        app: security-platform
        tier: backend
        version: v1.0.0
      annotations:
        # Prometheus 指标抓取注解
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      # 终止宽限期: 30 秒优雅停止
      terminationGracePeriodSeconds: 30

      # 安全上下文: 不以 root 运行
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: app
          image: security-platform:v1.0.0    # 替换为实际镜像仓库地址
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # === 资源请求与限制 ===
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          # === 环境变量: 从 ConfigMap 和 Secret 引用 ===
          env:
            # 非敏感配置 → 来自 ConfigMap
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: security-platform-config
                  key: APP_ENV
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: security-platform-config
                  key: APP_NAME
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: security-platform-config
                  key: LOG_LEVEL
            - name: WORKERS
              valueFrom:
                configMapKeyRef:
                  name: security-platform-config
                  key: WORKERS
            - name: FILE_STORAGE_PATH
              valueFrom:
                configMapKeyRef:
                  name: security-platform-config
                  key: FILE_STORAGE_PATH
            - name: FEATURE_MULTI_TENANT
              valueFrom:
                configMapKeyRef:
                  name: security-platform-config
                  key: FEATURE_MULTI_TENANT
            - name: FEATURE_DEFENSE_MODULES
              valueFrom:
                configMapKeyRef:
                  name: security-platform-config
                  key: FEATURE_DEFENSE_MODULES
            - name: FEATURE_THREAT_HUNTING
              valueFrom:
                configMapKeyRef:
                  name: security-platform-config
                  key: FEATURE_THREAT_HUNTING

            # 敏感配置 → 来自 Secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: security-platform-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: security-platform-secret
                  key: REDIS_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: security-platform-secret
                  key: JWT_SECRET_KEY
            - name: ENCRYPTION_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: security-platform-secret
                  key: ENCRYPTION_MASTER_KEY
            - name: API_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: security-platform-secret
                  key: API_AUTH_KEY
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: security-platform-secret
                  key: LLM_API_KEY

          # === 存活探针: 检测应用是否卡死 ===
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          # === 就绪探针: 检测是否可以接收流量 ===
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # === 启动探针: 给慢启动应用足够时间 ===
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10

          # === 数据卷挂载 ===
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: app-logs
              mountPath: /app/logs

      # === 数据卷定义 ===
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: security-platform-data-pvc
        - name: app-logs
          persistentVolumeClaim:
            claimName: security-platform-logs-pvc

      # 节点亲和性: 优先调度到不同可用区
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - security-platform
                topologyKey: topology.kubernetes.io/zone
