# =============================================================================
# Nginx 生产配置 - SecurityAI Platform
# 功能: SSL 终止 / 反向代理 / 限流 / 安全头 / 缓存 / WebSocket / gzip
# 语法验证: nginx -t -c /etc/nginx/nginx.conf
# =============================================================================

# ---------------------------------------------------------------------------
# 全局块
# ---------------------------------------------------------------------------
user  nginx;
worker_processes  auto;                    # 自动匹配 CPU 核心数
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# worker 连接数优化
events {
    worker_connections  4096;              # 每 worker 最大连接数
    multi_accept on;                       # 一次接受多个连接
    use epoll;                             # Linux 高效事件模型
}

# ---------------------------------------------------------------------------
# HTTP 块
# ---------------------------------------------------------------------------
http {
    # --- MIME 类型 ---
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- 日志格式: 包含请求耗时 / 上游响应时间 ---
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'request_time=$request_time upstream_time=$upstream_response_time '
                      'upstream_addr=$upstream_addr';

    access_log  /var/log/nginx/access.log  main;

    # --- 基础性能优化 ---
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 100m;              # 大文件上传支持 (扫描报告/APK)

    # --- Gzip 压缩 ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        font/truetype
        font/opentype
        image/svg+xml;

    # --- 限流配置 (按 IP) ---
    # 请求限流: 每个 IP 10 请求/秒，突发 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # 连接限流: 每个 IP 最多 50 个并发连接
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 限制并发连接数
    limit_conn conn_limit 50;
    limit_req_status 429;
    limit_conn_status 429;

    # --- 上游应用服务器 ---
    upstream app_server {
        server app:8000;                   # Docker Compose 服务名
        keepalive 32;                      # 长连接复用池
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    # -----------------------------------------------------------------------
    # HTTP 服务器: 80 端口 → 重定向到 HTTPS
    # -----------------------------------------------------------------------
    server {
        listen 80;
        server_name security.example.com;

        # 健康检查端点 (HTTP 也可访问，用于负载均衡探测)
        location = /health {
            proxy_pass http://app_server;
            access_log off;
        }

        # 所有其他请求重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -----------------------------------------------------------------------
    # HTTPS 服务器: 443 端口 (主服务)
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name security.example.com;

        # --- SSL 证书配置 ---
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # --- TLS 协议版本 ---
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # --- 现代加密套件 (TLS 1.2) ---
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        # --- SSL 会话缓存 ---
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # --- HSTS: 强制浏览器使用 HTTPS (1年) ---
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --- 安全响应头 ---
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # --- 安全: 隐藏 Nginx 版本号 ---
        server_tokens off;

        # --- 健康检查端点 (不经过限流) ---
        location = /health {
            proxy_pass http://app_server;
            access_log off;

            # 不上送安全头到内部健康检查
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 静态资源: /static/ 目录缓存 7 天 ---
        location /static/ {
            proxy_pass http://app_server;
            proxy_cache_valid 200 7d;       # 静态资源缓存 7 天
            expires 7d;
            add_header Cache-Control "public, immutable";

            # 静态资源不写入访问日志
            access_log off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- HTML 页面: 不缓存 (保证实时性) ---
        location ~* \.html$ {
            proxy_pass http://app_server;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- WebSocket 支持 (实时扫描推送/日志流) ---
        location /ws/ {
            proxy_pass http://app_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 长连接不超时
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # --- API 接口 (应用主路由) ---
        location / {
            # 应用限流 (按 IP)
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://app_server;
            proxy_http_version 1.1;

            # 超时配置: 适配长扫描任务 (300s)
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # 缓冲配置
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;

            # 传递客户端信息到后端
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # 长连接保持
            proxy_set_header Connection "";
        }

        # --- 拒绝访问隐藏文件 (.git, .env 等) ---
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
