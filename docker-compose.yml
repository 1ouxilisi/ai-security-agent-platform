# =============================================================================
# AI Hacking Agent - 一键部署 docker-compose.yml
# 用法:
#   docker compose up -d --build              # 启动 app（内置 SQLite/内存存储）
#   APP_WITH_DB=1 docker compose up -d --build  # 附加 PostgreSQL + Redis
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 应用服务
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-hacking-agent:latest
    container_name: ai-hacking-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 可选外部服务连接串（仅在启用 db/redis 服务时生效）
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiah_user}:${POSTGRES_PASSWORD:-aiah_pass}@db:5432/${POSTGRES_DB:-aiah}
      REDIS_URL: redis://:${REDIS_PASSWORD:-aiah_redis}@redis:6379/0
      # License 签名公钥/主密钥（生产环境请通过 .env 覆盖）
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      LICENSE_MASTER_KEY: ${LICENSE_MASTER_KEY:-change-me-license-master}
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - app_reports:/app/reports
    depends_on:
      - db
      - redis
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 可选: PostgreSQL 16
  # 默认与 app 同网络，不对宿主机暴露端口；需要直连时解开 ports 注释
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: aiah-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiah_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiah_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aiah}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiah_user} -d ${POSTGRES_DB:-aiah}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 可选: Redis 7（缓存 / 限流 / 会话）
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aiah-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-aiah_redis}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # ports:
    #   - "6379:6379"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aiah_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


# =============================================================================
# 持久化数据卷
# =============================================================================
volumes:
  app_data:
    driver: local
  app_logs:
    driver: local
  app_reports:
    driver: local
  pg_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# 网络
# =============================================================================
networks:
  app-net:
    driver: bridge
