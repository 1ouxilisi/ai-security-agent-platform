name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pydantic python-dotenv pyyaml fastapi uvicorn httpx openai pydantic
    
    - name: Syntax check all Python files
      run: |
        python -m py_compile app_lite.py || echo "app_lite.py syntax check"
        find . -name "*.py" -not -path "./.git/*" -exec python -m py_compile {} \; || echo "Some files have syntax issues (non-blocking)"
    
    - name: Basic import check
      run: |
        python -c "import fastapi; import pydantic; import httpx; print('Core imports OK')"
