# 实战能力模块配置
# Combat Module Configuration

# ============================================
# SQLMap 配置
# ============================================
[sqlmap]
# sqlmap.py路径（留空自动查找）
sqlmap_path = 
# Python解释器路径（留空使用当前Python）
python_path = 
# 默认测试级别 (1-5)
default_level = 3
# 默认风险级别 (1-3)
default_risk = 2
# 默认超时时间（秒）
default_timeout = 300
# 临时目录（留空使用系统临时目录）
temp_dir = 

# ============================================
# Metasploit 配置
# ============================================
[metasploit]
# RPC服务器地址
rpc_host = 127.0.0.1
# RPC服务器端口
rpc_port = 55553
# RPC用户名
rpc_username = msf
# RPC密码
rpc_password = msf
# 是否使用SSL
use_ssl = false
# 请求超时（秒）
timeout = 30
# 默认Payload监听地址
default_lhost = 127.0.0.1
# 默认Payload监听端口
default_lport = 4444

# ============================================
# AD域攻击 配置
# ============================================
[ad_attack]
# 默认域控IP
default_dc_ip = 
# 默认域名
default_domain = 
# 默认用户名
default_username = 
# 默认密码
default_password = 
# 默认NT哈希
default_nt_hash = 
# Kerberoasting超时（秒）
kerberoast_timeout = 120
# 密码字典路径
wordlist_path = /usr/share/wordlists/rockyou.txt

# ============================================
# Web漏洞扫描 配置
# ============================================
[web_scanner]
# 默认请求超时（秒）
default_timeout = 10
# 是否验证SSL证书
verify_ssl = false
# 是否跟随重定向
follow_redirects = true
# 默认User-Agent
default_user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
# 代理地址（留空不使用代理）
proxy = 
# 最大并发请求数
max_concurrent = 10

# ============================================
# 攻击模板 配置
# ============================================
[workflow]
# 任务重试次数
max_retries = 2
# 任务失败处理方式 (continue/abort/retry)
on_failure = continue
# 是否启用人工审核节点
enable_approval = true
# 人工审核超时（秒）
approval_timeout = 300

# ============================================
# 安全限制 配置
# ============================================
[security]
# 是否启用实战能力（生产环境建议关闭）
enable_combat = true
# 允许的目标IP范围（CIDR格式，逗号分隔，留空=不限制）
allowed_targets = 
# 禁止的目标IP范围
denied_targets = 127.0.0.1, localhost
# 是否记录审计日志
enable_audit_log = true
# 审计日志路径
audit_log_path = logs/combat_audit.log
# 最大执行时间（秒）
max_execution_time = 3600
