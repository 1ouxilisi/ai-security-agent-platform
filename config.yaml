# AI Hacking Agent 默认配置文件
# 复制为 .env 并根据实际环境修改

# 服务器配置
server:
  host: 0.0.0.0
  port: 8000
  debug: false
  workers: 4

# 数据库配置
database:
  type: sqlite
  path: data/hacking_agent.db
  # PostgreSQL配置（如需）
  # host: localhost
  # port: 5432
  # name: hacking_agent
  # user: postgres
  # password: your_password

# Redis配置
redis:
  host: localhost
  port: 6379
  db: 0
  password: ""

# 安全配置
security:
  secret_key: ${SECRET_KEY:-change-me-in-production}
  jwt_expire_minutes: 60
  api_key_header: X-API-Key
  rate_limit_per_minute: 100

# 日志配置
logging:
  level: INFO
  file: logs/app.log
  max_size_mb: 100
  backup_count: 10

# 安全工具配置
tools:
  nmap_path: nmap
  sqlmap_path: sqlmap
  nuclei_path: nuclei
  timeout_seconds: 300

# 扫描配置
scanning:
  default_timeout: 30
  default_threads: 10
  rate_limit: 0.1
  user_agent: "AI-Hacking-Agent/1.0"

# 报告配置
reporting:
  output_dir: reports
  formats: [html, pdf, json]
  include_charts: true
