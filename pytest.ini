[pytest]
# 测试目录
testpaths = tests

# 测试文件匹配
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出配置
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes

# 标记注册
markers =
    slow: 标记慢速测试
    integration: 标记集成测试
    unit: 标记单元测试
    security: 标记安全测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率配置（需要pytest-cov）
# addopts += --cov=. --cov-report=html --cov-report=term-missing
# cov_exclude = 
#     tests/*
#     scripts/*
#     setup.py
