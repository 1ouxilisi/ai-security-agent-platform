# =============================================================================
# 使用建议：
# 1. 渐进式启用：先将 allow_failure 设为 true，观察一段时间后再改为 false
# 2. 误报处理：将误报漏洞类型加入白名单（在check命令中通过 --fail-on 调整）
# 3. 扫描频率：MR时快速扫描，主分支和定时任务执行深度扫描
# 4. 报告留存：安全报告建议保留90天以上，便于审计追溯
# =============================================================================
