# =============================================================================
# AI Hacking Agent - GitLab CI/CD 安全扫描集成模板
# =============================================================================
# 使用说明：
#   1. 将本文件保存为项目根目录的 .gitlab-ci.yml（或合并到现有配置中）
#   2. 在 GitLab Settings -> CI/CD -> Variables 中配置以下变量：
#      - AI_HACKING_API_URL:   AI安全扫描API服务地址
#      - AI_HACKING_API_KEY:   API密钥（如果开启了认证）
#      - AI_HACKING_TARGET:    待扫描目标URL/域名
#   3. 根据需要调整阈值、扫描类型和触发条件
#   4. 提交代码后自动执行安全扫描
#
# 退出码说明：
#   0 = 扫描通过，允许部署
#   1 = 发现高危漏洞，阻止部署
#   2 = 扫描服务异常
#   3 = 配置参数错误
#
# 通知配置（可选）：
#   - 邮件通知：在 .gitlab-ci.yml 中配置邮件收件人
#   - 企业微信/钉钉：使用 webhook 通知（见文末示例）
# =============================================================================

stages:
  - build
  - security_scan    # 安全扫描阶段（在部署前执行）
  - report_generation
  - deploy

# =============================================================================
# 全局变量配置
# =============================================================================
variables:
  # AI Hacking Agent 配置
  AI_HACKING_API_URL: "http://ai-hacking-agent:8000"
  AI_HACKING_API_KEY: ""  # 建议使用GitLab CI变量存储
  AI_HACKING_TARGET: "https://your-app.example.com"
  AI_HACKING_THRESHOLD: "high"

  # 扫描配置
  SCAN_TYPE: "comprehensive"
  SCAN_DEPTH: "standard"
  REPORT_FORMAT: "html"

  # Python环境
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# =============================================================================
# 缓存配置
# =============================================================================
cache:
  paths:
    - .cache/pip
  key: "${CI_COMMIT_REF_SLUG}"

# =============================================================================
# 安全扫描阶段
# =============================================================================
security_scan:
  stage: security_scan
  image: python:3.11-slim
  before_script:
    - pip install --quiet requests pyyaml
    # 确保cicd模块在Python路径中
    - export PYTHONPATH="$CI_PROJECT_DIR:$PYTHONPATH"

  script:
    # 1. 执行综合安全扫描
    - |
      echo "=== 开始安全扫描 ==="
      echo "目标: $AI_HACKING_TARGET"
      echo "类型: $SCAN_TYPE"
      python -m cicd.cli scan \
        --target "$AI_HACKING_TARGET" \
        --type "$SCAN_TYPE" \
        --depth "$SCAN_DEPTH" \
        --api-url "$AI_HACKING_API_URL" \
        --api-key "$AI_HACKING_API_KEY" \
        --format json \
        --output scan-result.json || SCAN_EXIT_CODE=$?

    # 2. 关键漏洞专项验证（SQL注入）
    - |
      echo "=== SQL注入专项验证 ==="
      python -m cicd.cli verify \
        --target "$AI_HACKING_TARGET" \
        --vuln-type sql_injection \
        --api-url "$AI_HACKING_API_URL" \
        --api-key "$AI_HACKING_API_KEY" \
        --format json || true  # 验证失败不阻断流程

    # 3. XSS专项验证
    - |
      echo "=== XSS专项验证 ==="
      python -m cicd.cli verify \
        --target "$AI_HACKING_TARGET" \
        --vuln-type xss \
        --api-url "$AI_HACKING_API_URL" \
        --api-key "$AI_HACKING_API_KEY" \
        --format json || true

  artifacts:
    when: always  # 无论成功失败都保留产物
    paths:
      - scan-result.json
    reports:
      # 可选：转换为JUnit格式供GitLab展示
      # junit: scan-result.xml
    expire_in: 30 days  # 报告保留30天

  allow_failure: false  # 安全扫描失败阻止后续部署
  # 仅在以下情况执行
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# =============================================================================
# 漏洞阈值检查（决定是否允许部署）
# =============================================================================
vulnerability_check:
  stage: security_scan
  image: python:3.11-slim
  needs: ["security_scan"]
  before_script:
    - pip install --quiet requests pyyaml
    - export PYTHONPATH="$CI_PROJECT_DIR:$PYTHONPATH"

  script:
    - |
      echo "=== 漏洞阈值检查 ==="
      echo "阈值: $AI_HACKING_THRESHOLD"
      python -m cicd.cli check \
        --target "$AI_HACKING_TARGET" \
        --threshold "$AI_HACKING_THRESHOLD" \
        --type "$SCAN_TYPE" \
        --api-url "$AI_HACKING_API_URL" \
        --api-key "$AI_HACKING_API_KEY" \
        --format json

  allow_failure: false  # 有高危漏洞时必须失败，阻止部署
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# =============================================================================
# 报告生成阶段
# =============================================================================
generate_report:
  stage: report_generation
  image: python:3.11-slim
  needs: ["security_scan"]
  before_script:
    - pip install --quiet requests pyyaml
    - export PYTHONPATH="$CI_PROJECT_DIR:$PYTHONPATH"

  script:
    - |
      echo "=== 生成安全报告 ==="
      # 从扫描结果中提取assessment_id
      ASSESSMENT_ID=$(python -c "
import json
try:
    with open('scan-result.json') as f:
        data = json.load(f)
    print(data.get('assessment_id', ''))
except:
    print('')
")

      if [ -n "$ASSESSMENT_ID" ]; then
        python -m cicd.cli report \
          --assessment-id "$ASSESSMENT_ID" \
          --report-format "$REPORT_FORMAT" \
          --output "security-report.$REPORT_FORMAT" \
          --api-url "$AI_HACKING_API_URL" \
          --api-key "$AI_HACKING_API_KEY" \
          --format text
      else
        echo "未找到有效的assessment_id，跳过报告生成"
      fi

  artifacts:
    when: always
    paths:
      - "security-report.*"
    expire_in: 90 days

# =============================================================================
# 部署阶段（仅安全检查通过后执行）
# =============================================================================
deploy:
  stage: deploy
  image: alpine:latest
  needs: ["vulnerability_check"]  # 依赖安全检查通过
  script:
    - echo "安全检查通过，开始部署..."
    # 在此添加你的实际部署命令

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always

# =============================================================================
# 定时全量扫描（每天凌晨2点）
# =============================================================================
scheduled_scan:
  stage: security_scan
  image: python:3.11-slim
  before_script:
    - pip install --quiet requests pyyaml
    - export PYTHONPATH="$CI_PROJECT_DIR:$PYTHONPATH"

  script:
    - |
      echo "=== 定时全量深度扫描 ==="
      python -m cicd.cli scan \
        --target "$AI_HACKING_TARGET" \
        --type comprehensive \
        --depth deep \
        --api-url "$AI_HACKING_API_URL" \
        --api-key "$AI_HACKING_API_KEY" \
        --format json \
        --output scheduled-scan-result.json

  only:
    - schedules

  artifacts:
    when: always
    paths:
      - scheduled-scan-result.json
    expire_in: 90 days

