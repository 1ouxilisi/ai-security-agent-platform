[metadata]
name = ai-hacking-agent
version = 1.0.0
description = AI驱动的智能安全评估与渗透测试平台
long_description = file: README.md
license = Proprietary

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
exclude =
    tests*
    docs*
    scripts*

[flake8]
max-line-length = 120
extend-ignore = E203, W503, E501, F401, W605
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    node_modules,
    data,
    logs,
    reports

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
